<!DOCTYPE html>

<head>

  <title>Bookings · Matchanese</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="bk-app">
  <header class="bk-topbar">
    <div class="bk-topbar-inner">
      <a class="bk-brand" href="#/all" aria-label="Bookings home">
        <span class="bk-brand-title">Bookings</span>
        <span class="bk-proto-tag" title="Sample data only; nothing is saved">Sample data</span>
      </a>
      <nav class="bk-tabs" aria-label="Views">
        <a class="bk-tab" data-view="all" href="#/all">All <span class="bk-tab-count" data-count="all"></span></a>
        <a class="bk-tab" data-view="pipeline" href="#/pipeline">Board <span class="bk-tab-count" data-count="pipeline"></span></a>

      <div class="bk-topbar-actions">

          <input id="globalSearch" type="search" placeholder="Search client, venue, INV-…" autocomplete="off">
        </label>
        <button class="inv-btn inv-btn-primary" type="button" data-action="new-booking">+ New</button>
      </div>
    </div>
  </header>

  <main id="app" class="bk-main" tabindex="-1"></main>

  <div id="toastRoot" class="bk-toast-root" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="../invoice-generator/js/invoice-payment-alloc.js"></script>
  <script src="../chatbase-leads-dashboard/public/js/config.js"></script>
  <script type="module" src="js/app.js"></script>
