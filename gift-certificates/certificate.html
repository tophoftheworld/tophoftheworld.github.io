<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Certificate - Matchanese</title>
    <link rel="stylesheet" href="css/certificate.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="certificate-page">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading certificate...</p>
    </div>

    <!-- Error Screen -->
    <div id="errorScreen" class="error-screen is-hidden" hidden>
        <div class="error-icon">⚠️</div>
        <h2>Certificate Not Found</h2>
        <p id="errorMessage">The certificate you're looking for could not be found.</p>
        <button onclick="window.location.href='dashboard.html'" class="gc-btn gc-btn-primary">
            Go to Dashboard
        </button>
    </div>

    <!-- Certificate Container -->
    <div id="certificateContainer" class="certificate-container is-hidden" hidden>
        <!-- Status Banner -->
        <div id="statusBanner" class="status-banner is-hidden" hidden>
            <p id="statusText"></p>
        </div>

        <div class="certificate-wrapper">
            <div class="certificate-card">
                <div class="certificate-header">
                    <h1>Gift Certificate</h1>
                    <div class="certificate-logo">🎁</div>
                </div>

                <div class="certificate-value-section">
                    <div class="value-label">Value</div>
                    <div id="certificateValue" class="certificate-value">₱0.00</div>
                </div>

                <div class="certificate-qr-section">
                    <div id="qrCode" class="qr-code-container"></div>
                </div>

                <div class="certificate-details">
                    <div id="givenBy" class="certificate-detail is-hidden" hidden></div>
                    <div id="givenTo" class="certificate-detail is-hidden" hidden></div>
                    <div id="description" class="certificate-description is-hidden" hidden></div>
                    <div id="expiry" class="certificate-expiry is-hidden" hidden></div>
                </div>

                <div class="certificate-footer">
                    <div id="certificateId" class="certificate-id">GC-0000-0000-000</div>
                    <div class="certificate-brand">Matchanese</div>
                </div>
            </div>
        </div>

        <div class="certificate-actions">
            <button onclick="window.print()" class="gc-btn gc-btn-secondary">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="currentColor" d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
                </svg>
                Print
            </button>
            <button onclick="window.location.href='scanner.html'" class="gc-btn gc-btn-primary">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="currentColor" d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm6.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5zM22 7h-2V4h-3V2h5v5zm0 15v-5h-2v3h-3v2h5zM2 22h5v-2H4v-3H2v5zM2 2v5h2V4h3V2H2z"/>
                </svg>
                Scan Certificate
            </button>
        </div>
    </div>

    <script type="module" src="js/certificate.js"></script>
</body>
</html>
