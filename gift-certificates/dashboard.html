<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Certificates - Matchanese</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
</head>
<body class="certificates-app">
    <section class="certificates-list-screen">
        <header class="certificates-list-header">
            <div>
                <h1>Gift Certificates</h1>
                <p class="certificates-list-sub">Create and manage mobile gift vouchers with QR codes.</p>
            </div>
            <button type="button" id="newCertificateBtn" class="gc-btn gc-btn-primary">New Certificate</button>
        </header>

        <div class="certificates-list-toolbar">
            <input type="search" id="searchInput" placeholder="Search by ID, giver, or recipient…" autocomplete="off">
            <select id="statusFilter" class="gc-select">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="claimed">Claimed</option>
                <option value="expired">Expired</option>
            </select>
            <button type="button" id="refreshBtn" class="gc-btn gc-btn-secondary">Refresh</button>
        </div>

        <div id="listStatus" class="certificates-list-status">Loading certificates…</div>
        <div id="certificateList" class="certificates-list-grid"></div>
    </section>

    <!-- Create Certificate Modal -->
    <div id="certificateModal" class="certificate-modal-overlay is-hidden" hidden>
        <div class="certificate-modal">
            <div class="certificate-modal-header">
                <h2>Create Gift Certificate</h2>
                <button type="button" id="closeModalBtn" class="certificate-modal-close">&times;</button>
            </div>
            
            <form id="certificateForm" class="certificate-form">
                <div class="form-group">
                    <label for="value">Value (₱) *</label>
                    <input type="number" id="value" name="value" min="1" step="0.01" required placeholder="500.00">
                </div>

                <div class="form-group">
                    <label for="givenBy">Given By</label>
                    <input type="text" id="givenBy" name="givenBy" placeholder="Optional - Who is giving this gift">
                </div>

                <div class="form-group">
                    <label for="givenTo">Given To</label>
                    <input type="text" id="givenTo" name="givenTo" placeholder="Optional - Who will receive this gift">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="2" placeholder="Optional - Note or message"></textarea>
                </div>

                <div class="form-group">
                    <label for="expiryDate">Expiry Date</label>
                    <input type="date" id="expiryDate" name="expiryDate">
                    <p class="form-hint">Optional - Leave blank for no expiration</p>
                </div>

                <div class="certificate-form-actions">
                    <button type="button" class="gc-btn gc-btn-secondary" onclick="document.getElementById('closeModalBtn').click()">Cancel</button>
                    <button type="submit" class="gc-btn gc-btn-primary">Create Certificate</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
