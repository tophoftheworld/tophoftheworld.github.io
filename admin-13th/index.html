<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Admin · 13th Month 2025</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../admin-payroll_legacy/css/admin-style.css">
    <style>
        body { background: #f7f8fa; }
        .thirteenth-container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
        .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
        .page-header h1 { margin:0; font-size:1.5rem; font-weight:700; }
        .pill { background:#eef2ff; color:#4f46e5; border-radius:999px; padding:4px 10px; font-size:0.85rem; font-weight:600; }
        .controls-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
        .data-card { background:white; border:1px solid #e5e7eb; border-radius:12px; padding:16px; box-shadow:0 2px 6px rgba(0,0,0,0.04); }
        table th { background:#f8fafc; }
        .small { font-size:0.9rem; color:#475467; }
        .loading { display:none; align-items:center; gap:8px; color:#475467; font-weight:600; }
        .detail-row { background:#f8fafc; }
        .detail-cell { padding:12px 16px; border-top:1px solid #e5e7eb; }
        .period-table { width:100%; border-collapse:collapse; }
        .period-table th, .period-table td { padding:8px 10px; border-bottom:1px solid #e5e7eb; text-align:left; }
        .period-table th { background:#eef2ff; font-weight:600; }
        .clickable-row:hover { background:#f8fafc; }
        .editable { background:#fffbe6; cursor:text; }
    </style>
</head>
<body>
    <div class="thirteenth-container">
        <div class="page-header">
            <div>
                <h1>13th Month (Admin)</h1>
                <div class="small">Year 2025 · Basic-only, per payroll period</div>
            </div>
            <span class="pill">Internal tool</span>
        </div>

        <div class="controls-row">
            <button id="refreshBtn" class="btn">Refresh Data</button>
            <button id="exportBtn" class="btn primary">Export CSV</button>
            <label style="display:flex; align-items:center; gap:6px;">
                <input type="checkbox" id="toggleTotals" />
                <span class="small">Show period totals</span>
            </label>
            <label style="display:flex; align-items:center; gap:6px;">
                <input type="checkbox" id="toggleReceiversOnly" />
                <span class="small">Show only receiving 13th</span>
            </label>
            <div id="overallTotal" class="small" style="font-weight:700; margin-left:auto;">Total 13th to pay: —</div>
            <div id="loadingIndicator" class="loading">
                <span>⏳ Loading…</span>
                <span id="loadingText"></span>
            </div>
        </div>

        <div class="data-card">
            <table class="data-table" id="summaryTable">
                <thead>
                    <tr>
                        <th id="receiveHeader" style="width:50px;"></th>
                        <th>Employee</th>
                        <th>Periods Covered</th>
                        <th>YTD Basic (2025)</th>
                        <th>YTD Full (2025)</th>
                        <th>13th Month (YTD ÷ 12)</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr><td colspan="5" style="text-align:center;">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="../shared/js/PayCalculator.js?v=20250116"></script>
    <script type="module" src="js/script.js?v=20250122"></script>
</body>
</html>
