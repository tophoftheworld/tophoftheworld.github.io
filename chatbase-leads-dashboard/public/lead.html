<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Detail</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <a class="subtle back-link" href="index.html">&larr; Back to dashboard</a>
      <h1 id="lead-title">Lead detail</h1>
    </div>
  </header>

  <main class="lead-layout">
    <section class="panel">
      <h2>Contact</h2>
      <dl id="contact-fields" class="field-list"></dl>
    </section>

    <section class="panel">
      <h2>Booking details</h2>
      <dl id="booking-fields" class="field-list"></dl>
    </section>

    <section class="panel">
      <div class="panel-title-row">
        <h2>Status</h2>
        <span id="lead-status-pill" class="status-pill">unknown</span>
      </div>
      <form id="status-form" class="status-form">
        <label>Set new status
          <select id="status-select" required>
            <option value="new">New</option>
            <option value="qualified">Qualified</option>
            <option value="follow_up">Follow up</option>
            <option value="proposal_sent">Proposal sent</option>
            <option value="won">Won</option>
            <option value="lost">Lost</option>
          </select>
        </label>
        <label>Note
          <input id="status-note" type="text" placeholder="Optional note">
        </label>
        <button class="btn btn-primary" type="submit">Update status</button>
      </form>
    </section>

    <section class="panel">
      <h2>Status timeline</h2>
      <ul id="timeline-list" class="timeline-list">
        <li class="empty">No status events yet.</li>
      </ul>
    </section>

    <section class="panel">
      <h2>Conversation excerpts</h2>
      <div id="conversation-list" class="conversation-list">
        <p class="empty">No conversation snapshots yet.</p>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/lead.js"></script>
</body>
</html>
