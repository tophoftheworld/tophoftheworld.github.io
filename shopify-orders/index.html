<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopify Orders</title>
    <link rel="icon" href="data:," />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/hub/hub-shell.css" />
    <link rel="stylesheet" href="css/orders-dashboard.css?v=84" />
    <link rel="stylesheet" href="/hub/hub.css" />
</head>
<body>
    <div class="container">
        <header class="admin-header app-chrome">
            <div class="logo-section">
                <div data-hub-nav-logo>
                    <img src="img/matchanese-logo.png" class="logo" alt="Matchanese" />
                </div>
                <h1 class="app-title">Shopify Orders</h1>
            </div>
            <div class="type-selector" id="typeSelector" aria-label="Order type">
                <button type="button" class="type-btn active" data-type="">All</button>
                <button type="button" class="type-btn" data-type="workshop">Workshops</button>
                <button type="button" class="type-btn" data-type="product">Products</button>
            </div>
        </header>

        <div class="main-controls app-chrome shopify-filters-bar" id="ordersFiltersBar">
            <div class="filters-mobile-toolbar">
                <div class="control-group control-group--search">
                    <label for="searchInput">Search</label>
                    <input type="search" id="searchInput" placeholder="Order, customer, email…" />
                </div>
                <button
                    type="button"
                    class="action-btn secondary product-queue-btn"
                    id="btnProductQueue"
                    hidden
                    aria-pressed="false"
                    title="Paid, awaiting ship or pickup"
                >
                    Pending
                </button>
                <button
                    type="button"
                    class="action-btn secondary filters-toggle-btn"
                    id="btnFiltersToggle"
                    aria-expanded="false"
                    aria-controls="filtersExtraPanel"
                    aria-label="Filters"
                >
                    <svg class="filters-toggle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
                    </svg>
                    <span class="filters-active-badge hidden" id="filtersActiveBadge" aria-hidden="true"></span>
                </button>
            </div>
            <div class="filters-extra-panel" id="filtersExtraPanel">
                <div class="control-group control-group--compact">
                    <label for="filterStatus">Status</label>
                    <select id="filterStatus">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="control-group control-group--compact">
                    <label for="filterProduct">Product</label>
                    <select id="filterProduct">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="control-group control-group--compact">
                    <label for="filterProductType">Type</label>
                    <select id="filterProductType">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="control-group control-group--compact">
                    <label for="filterDelivery">Delivery</label>
                    <select id="filterDelivery">
                        <option value="">All</option>
                        <option value="pickup">Pickup</option>
                        <option value="metro">Metro Manila</option>
                        <option value="nationwide">Nationwide</option>
                    </select>
                </div>
            </div>
        </div>

        <p class="status-bar app-chrome" id="statusBar" aria-live="polite" role="status"></p>

        <div class="workspace" id="workspace">
            <div class="list-pane" id="listPane">
                <div class="list-pane-scroll">
                    <div class="entity-card-list" id="ordersCardList" aria-label="Orders"></div>
                    <div class="data-table-container list-table-wrap">
                        <table id="ordersTable">
                            <thead>
                                <tr>
                                    <th class="col-select" scope="col" aria-label="Select">
                                        <input type="checkbox" class="batch-select-all" id="batchSelectAll" title="Select all on this page" aria-label="Select all orders on this page" />
                                    </th>
                                    <th data-sort="name" class="col-order">Order</th>
                                    <th data-sort="type" class="col-type">Type</th>
                                    <th data-sort="created_at" class="col-date">Date</th>
                                    <th data-sort="customer" class="col-customer">Customer</th>
                                    <th data-sort="workshopSessionLabel" class="col-session">Session</th>
                                    <th data-sort="item_count" class="col-items">Items</th>
                                    <th data-sort="total" class="col-total">Total</th>
                                    <th data-sort="deliveryTypeLabel" class="col-delivery">Delivery</th>
                                    <th data-sort="orderStatusLabel" class="col-status">Status</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                <div class="batch-action-bar hidden" id="batchActionBar" role="toolbar" aria-label="Batch actions">
                    <span class="batch-action-bar__count" id="batchSelectedCount">0 selected</span>
                    <div class="batch-action-bar__actions" id="batchActionButtons"></div>
                    <button type="button" class="action-btn secondary" id="btnBatchClear">Clear selection</button>
                </div>
                <nav class="pagination-bar list-pane-pagination" aria-label="Orders pagination">
                    <button type="button" class="action-btn secondary" id="btnPrev" disabled>Previous</button>
                    <span class="page-status-line">
                        <span class="page-indicator" id="pageIndicator">Page 1</span>
                        <span class="page-status-sep" aria-hidden="true">·</span>
                        <button type="button" class="page-select-link" id="btnSelectMode" aria-pressed="false">Select</button>
                        <span class="orders-sync-indicator" id="ordersSyncIndicator" hidden aria-hidden="true" title="Syncing orders"></span>
                    </span>
                    <button type="button" class="action-btn secondary" id="btnNext" disabled>Next</button>
                </nav>
            </div>

            <div
                class="detail-modal-backdrop hidden"
                id="detailModalBackdrop"
                aria-hidden="true"
            ></div>
            <aside class="detail-pane hidden" id="detailPane" aria-label="Order details">
                <div class="detail-pane-inner">
                    <div class="detail-loading-overlay hidden" id="detailLoadingOverlay" aria-hidden="true">
                        <div class="detail-spinner" aria-hidden="true"></div>
                        <p class="detail-loading-text">Loading order details…</p>
                    </div>
                    <header class="detail-pane-header hidden" id="detailPaneHeader"></header>
                    <div class="detail-pane-body" id="detailPaneBody">
                        <p class="detail-placeholder">Select an order to view details.</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div id="confirmDialog" class="confirm-dialog" hidden aria-hidden="true" role="dialog" aria-labelledby="confirmDialogTitle" aria-modal="true">
        <div class="confirm-dialog__backdrop"></div>
        <div class="confirm-dialog__panel">
            <h2 id="confirmDialogTitle" class="confirm-dialog__title">Confirm</h2>
            <p id="confirmDialogMessage" class="confirm-dialog__message"></p>
            <label id="confirmDialogOptionWrap" class="confirm-dialog__option" hidden>
                <input type="checkbox" id="confirmDialogCheckbox" />
                <span id="confirmDialogOptionLabel"></span>
            </label>
            <div class="confirm-dialog__actions">
                <button type="button" id="confirmDialogCancel" class="action-btn secondary">Keep</button>
                <button type="button" id="confirmDialogOk" class="action-btn confirm-dialog__ok--danger">Confirm</button>
            </div>
        </div>
    </div>

    <script src="/leads/js/config.js"></script>
    <script src="/hub/hub.js" defer></script>
    <script type="module" src="js/orders-dashboard.js?v=79"></script>
</body>
</html>
