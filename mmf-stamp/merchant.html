    <script>
        // Merchant data with logos
        const MERCHANTS = {
            'B01': { name: 'Matchanese', logo: 'images/matchanese.png' },
            'B02': { name: 'Shizu Matcha Bar', logo: 'images/shizu.png' },
            'B03': { name: 'Oh Hey There', logo: 'images/ohheythere.png' },
            'B04': { name: 'Day Off Space', logo: 'images/dayoff.png' },
            'B05': { name: 'Aichi Cafe', logo: 'images/aichi.png' },
            'B06': { name: 'Take Five Slow Bar', logo: 'images/takefive.png' },
            'B07': { name: 'Matcha Mama', logo: 'images/matchamama.png' },
            'B08': { name: 'Ujisan', logo: 'images/ujisan.png' },
            'B09': { name: 'Matcha Tokyo', logo: 'images/matchatokyo.png' },
            'B10': { name: 'Chotto Matcha', logo: 'images/chotto.png' },
            'B11': { name: 'The Matcha Co.', logo: 'images/thematchaco.png' },
            'B12': { name: 'Melc Patisserie', logo: 'images/melc.png' }
        };

        // Map brandId -> single-letter code (A..L)
        function brandLetter(brandId) {
            const n = parseInt(brandId.replace(/\D+/g, ''), 10); // 1..12
            const idx = Math.max(1, Math.min(12, n)) - 1;        // 0..11
            return String.fromCharCode('A'.charCodeAt(0) + idx); // 'A'..'L'
        }

        // Base58 encoding for compact random
        const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
        function bytesToBase58(bytes) {
            // Convert byte array to BigInt
            let x = 0n;
            for (const b of bytes) x = (x << 8n) + BigInt(b);
            // Encode
            let s = "";
            while (x > 0n) { s = B58[Number(x % 58n)] + s; x /= 58n; }
            // Preserve leading zeros
            let zeros = 0; for (const b of bytes) { if (b === 0) zeros++; else break; }
            return "1".repeat(zeros) + s || "1";
        }

        // Generate 12 random bytes (≈96 bits) → ~17 Base58 chars
        function randomBase58_12() {
            const u = (crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(12))
                : new Uint8Array(12).map(() => Math.floor(Math.random() * 256));
            return bytesToBase58(u);
        }

        // Final compact token: <BrandLetter><Base58(12 bytes)>
        function genCompactToken(brandId) {
            return brandLetter(brandId) + randomBase58_12();
        }

        // DOM refs
        const loginScreen = document.getElementById('loginScreen');
        const qrScreen = document.getElementById('qrScreen');
        const merchantSelect = document.getElementById('merchantSelect');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const merchantName = document.getElementById('merchantName');
        const merchantLogo = document.getElementById('merchantLogo');
        const qrBox = document.getElementById('qrBox');
        const qrStatus = document.getElementById('qrStatus');

        let currentMerchant = null;
        let currentToken = '';
        let currentQRId = '';
        let statusCheckInterval = null;
        
        // Default password for all merchants (placeholder)
        const DEFAULT_PASSWORD = 'mmf2025';

        // Login/Logout functions
        async function login() {
            const brandId = merchantSelect.value;
            const password = passwordInput.value.trim();
            
            if (!brandId || !password) return;
            
            // Hide any previous error
            loginError.classList.add('hidden');
            
            try {
                // Check password against Firebase or use default
                const isValidPassword = await validatePassword(brandId, password);
                
                if (isValidPassword) {
                    currentMerchant = MERCHANTS[brandId];
                    if (currentMerchant) {
                        merchantName.textContent = currentMerchant.name;
                        merchantLogo.src = currentMerchant.logo;
                        merchantLogo.alt = currentMerchant.name;
                        
                        // Save merchant login state
                        localStorage.setItem('mmf_merchant_login', brandId);
                        
                        loginScreen.classList.add('hidden');
                        qrScreen.classList.remove('hidden');
                        
                        // Clear password field
                        passwordInput.value = '';
                        
                        // Generate initial QR
                        generateNewWithFirebase();
                    }
                } else {
                    // Show error message
                    loginError.classList.remove('hidden');
                    passwordInput.focus();
                }
            } catch (error) {
                console.error('Login error:', error);
                // Fallback to default password check
                if (password === DEFAULT_PASSWORD) {
                    currentMerchant = MERCHANTS[brandId];
                    if (currentMerchant) {
                        merchantName.textContent = currentMerchant.name;
                        merchantLogo.src = currentMerchant.logo;
                        merchantLogo.alt = currentMerchant.name;
                        
                        // Save merchant login state
                        localStorage.setItem('mmf_merchant_login', brandId);
                        
                        loginScreen.classList.add('hidden');
                        qrScreen.classList.remove('hidden');
                        
                        // Clear password field
                        passwordInput.value = '';
                        
                        // Generate initial QR
                        generateNewWithFirebase();
                    }
                } else {
                    loginError.classList.remove('hidden');
                    passwordInput.focus();
                }
            }
        }

        // Password validation function
        async function validatePassword(merchantId, password) {
            // First check default password
            if (password === DEFAULT_PASSWORD) {
                return true;
            }
            
            // Then check Firebase if available
            if (window.firebase && window.firebase.db) {
                try {
                    const { collection, query, where, getDocs } = await import("https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js");
                    
                    const merchantsRef = collection(window.firebase.db, 'merchants');
                    const merchantQuery = query(merchantsRef, where('merchantId', '==', merchantId));
                    const querySnapshot = await getDocs(merchantQuery);
                    
                    if (!querySnapshot.empty) {
                        const merchantData = querySnapshot.docs[0].data();
                        return merchantData.password === password;
                    }
                } catch (error) {
                    console.error('Error validating password from Firebase:', error);
                }
            }
            
            return false;
        }
        
        function logout() {
            currentMerchant = null;
            currentToken = '';
            currentQRId = '';
            
            // Clear QR
            clearQR();
            
            // Clear saved login state
            localStorage.removeItem('mmf_merchant_login');
            
            // Reset form
            merchantSelect.value = '';
            passwordInput.value = '';
            loginBtn.disabled = true;
            loginError.classList.add('hidden');
            
            // Show login screen
            qrScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
        }

        function renderQR(text) {
            qrBox.innerHTML = '';
            const size = Math.min(qrBox.clientWidth || 256, 256);
            const holder = document.createElement('div');
            holder.style.width = size + 'px';
            holder.style.height = size + 'px';
            qrBox.appendChild(holder);
            
            try {
                new QRCode(holder, {
                    text,
                    width: size,
                    height: size,
                    correctLevel: QRCode.CorrectLevel.L,
                    colorDark: "#1f2937",
                    colorLight: "#ffffff"
                });
            } catch (e) {
                // Fallback text if QR lib fails
                const div = document.createElement('div');
                div.className = 'text-center';
                div.innerHTML = `
                    <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center mx-auto mb-3">
                        <svg class="w-8 h-8 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M3 4h4l5-5 5 5h4v4l-5 5-5-5H3V4zm0 16h4l5 5 5-5h4v-4l-5-5-5 5H3v4z"/>
                        </svg>
                    </div>
                    <div class="text-gray-500 font-medium">QR Error</div>
                    <div class="text-xs text-gray-400 mt-1 break-all">${text}</div>
                `;
                qrBox.appendChild(div);
            }
        }

        function clearQR() {
            currentToken = '';
            currentQRId = '';
            qrBox.innerHTML = `
                <div id="qrFallback" class="text-center">
                    <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <div class="w-6 h-6 border-2 border-gray-300 border-t-green-500 rounded-full animate-spin"></div>
                    </div>
                    <div class="text-gray-500 font-medium">Loading QR Code...</div>
                </div>`;
            qrStatus.classList.add('hidden');
            stopStatusCheck();
        }

        // Firebase QR Management Functions
        async function createQRInFirebase(merchantId, merchantName, token, type = 'live') {
            try {
                const { addDoc, collection } = await import("https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js");
                
                const qrData = {
                    qrId: generateQRId(),
                    merchantId: merchantId,
                    merchantName: merchantName,
                    token: token,
                    status: 'unused',
                    type: type,
                    createdAt: new Date(),
                    batchId: type === 'batch' ? generateBatchId() : null
                };
                
                const docRef = await addDoc(collection(window.firebase.db, 'qrcodes'), qrData);
                console.log('QR created in Firebase:', docRef.id);
                return docRef.id;
            } catch (error) {
                console.error('Error creating QR in Firebase:', error);
                throw error;
            }
        }
        
        async function getUnusedQR(merchantId, type = 'live') {
            try {
                const { collection, query, where, getDocs } = await import("https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js");
                
                const qrRef = collection(window.firebase.db, 'qrcodes');
                const q = query(qrRef, 
                    where('merchantId', '==', merchantId),
                    where('type', '==', type),
                    where('status', '==', 'unused')
                );
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    return querySnapshot.docs[0].data();
                }
                return null;
            } catch (error) {
                console.error('Error getting unused QR:', error);
                return null;
            }
        }
        
        function generateQRId() {
            return 'qr_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        function generateBatchId() {
            return 'batch_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        }
        
        // Start checking QR status every 3 seconds
        function startStatusCheck() {
            if (statusCheckInterval) {
                clearInterval(statusCheckInterval);
            }
            
            statusCheckInterval = setInterval(async () => {
                if (currentQRId && window.firebase && window.firebase.db) {
                    try {
                        const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js");
                        const qrRef = doc(window.firebase.db, 'qrcodes', currentQRId);
                        const qrDoc = await getDoc(qrRef);
                        
                        if (qrDoc.exists()) {
                            const qrData = qrDoc.data();
                            if (qrData.status === 'used') {
                                // QR has been used!
                                qrStatus.innerHTML = `
                                    <div class="flex items-center gap-2">
                                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                                        <span class="text-green-700">QR Code has been scanned! 🎉</span>
                                    </div>
                                `;
                                qrStatus.classList.remove('hidden', 'bg-blue-50');
                                qrStatus.classList.add('bg-green-50');
                                stopStatusCheck();
                                
                                // Auto-generate new QR after 2 seconds
                                setTimeout(() => {
                                    generateNewWithFirebase();
                                }, 2000);
                            }
                        }
                    } catch (error) {
                        console.error('Error checking QR status:', error);
                    }
                }
            }, 3000); // Check every 3 seconds
        }
        
        // Stop checking QR status
        function stopStatusCheck() {
            if (statusCheckInterval) {
                clearInterval(statusCheckInterval);
                statusCheckInterval = null;
            }
        }
        
        // Enhanced QR generation with Firebase integration
        async function generateNewWithFirebase() {
            if (!currentMerchant) return;
            
            // Check if Firebase is available
            if (!window.firebase || !window.firebase.db) {
                console.log('Firebase not available, using local generation');
                generateNew();
                return;
            }
            
            const brandId = Object.keys(MERCHANTS).find(key => MERCHANTS[key].name === currentMerchant.name);
            const merchantName = currentMerchant.name;
            
            try {
                // Stop previous status check
                stopStatusCheck();
                
                // Check for existing unused QR
                let existingQR = await getUnusedQR(brandId, 'live');
                
                if (existingQR) {
                    // Use existing QR
                    currentToken = existingQR.token;
                    currentQRId = existingQR.qrId;
                    console.log('Using existing QR:', existingQR.qrId);
                } else {
                    // Create new QR
                    const token = genCompactToken(brandId);
                    currentToken = token;
                    
                    const qrId = await createQRInFirebase(brandId, merchantName, token, 'live');
                    currentQRId = qrId;
                    console.log('New QR created in Firebase:', qrId);
                }
                
                renderQR(currentToken);
                
                // Start checking QR status
                qrStatus.innerHTML = `
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
                        <span class="text-blue-700">Waiting for scan...</span>
                    </div>
                `;
                qrStatus.classList.remove('hidden', 'bg-green-50');
                qrStatus.classList.add('bg-blue-50');
                startStatusCheck();
                
            } catch (error) {
                console.error('Firebase error, falling back to local generation:', error);
                generateNew();
            }
        }

        function generateNew() {
            if (!currentMerchant) return;
            
            const brandId = Object.keys(MERCHANTS).find(key => MERCHANTS[key].name === currentMerchant.name);
            const token = genCompactToken(brandId);
            currentToken = token;
            renderQR(token);
        }

        // PDF export functionality
        function saveSingleQRAsPDF() {
            if (!currentToken) {
                alert('Please generate a QR code first');
                return;
            }
            
            // Create a clean version of the QR card for PDF
            const qrCard = document.getElementById('qrCard');
            const pdfContent = qrCard.cloneNode(true);
            
            // Remove interactive elements from PDF version
            const buttons = pdfContent.querySelectorAll('button');
            buttons.forEach(btn => btn.remove());
            
            // Configure PDF options
            const opt = {
                margin: 10,
                filename: `qr-${currentToken}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            // Generate and download PDF
            html2pdf().set(opt).from(pdfContent).save();
        }

        function saveTestQRsAsPDF() {
            // Get the merchants data
            const merchants = Object.entries(MERCHANTS).map(([id, merchant]) => ({
                id: id,
                name: merchant.name
            }));
            
            // Pass merchants data to print page via URL parameters
            const merchantsData = encodeURIComponent(JSON.stringify(merchants));
            const printUrl = `print-qr.html?data=${merchantsData}`;
            
            // Open new window with print page
            window.open(printUrl, '_blank', 'width=800,height=1000');
        }

        async function saveBatchQRsAsPDF() {
            if (!currentMerchant) {
                alert('Please select a merchant first');
                return;
            }
            
            // Check if Firebase is available
            if (!window.firebase || !window.firebase.db) {
                console.log('Firebase not available, using local batch generation');
                // Fallback to original batch generation
                const brandId = Object.keys(MERCHANTS).find(key => MERCHANTS[key].name === currentMerchant.name);
                const merchantName = currentMerchant.name;
                const batchData = {
                    type: 'batch',
                    merchant: { id: brandId, name: merchantName },
                    count: 56
                };
                const batchDataEncoded = encodeURIComponent(JSON.stringify(batchData));
                const printUrl = `print-qr.html?data=${batchDataEncoded}`;
                window.open(printUrl, '_blank', 'width=800,height=1000');
                return;
            }
            
            // Generate multiple QR codes for the selected merchant
            const brandId = Object.keys(MERCHANTS).find(key => MERCHANTS[key].name === currentMerchant.name);
            const merchantName = currentMerchant.name;
            
            try {
                // Create batch QRs in Firebase
                const batchId = generateBatchId();
                const qrPromises = [];
                
                for (let i = 0; i < 56; i++) {
                    const token = genCompactToken(brandId);
                    qrPromises.push(createQRInFirebase(brandId, merchantName, token, 'batch'));
                }
                
                await Promise.all(qrPromises);
                console.log('Batch QRs created in Firebase');
                
                // Create batch data with 56 QR codes for the selected merchant (7x8 grid)
                const batchData = {
                    type: 'batch',
                    merchant: { id: brandId, name: merchantName },
                    count: 56,
                    batchId: batchId
                };
                
                // Pass batch data to print page via URL parameters
                const batchDataEncoded = encodeURIComponent(JSON.stringify(batchData));
                const printUrl = `print-qr.html?data=${batchDataEncoded}`;
                
                // Open new window with print page
                window.open(printUrl, '_blank', 'width=800,height=1000');
                
            } catch (error) {
                console.error('Error creating batch QRs:', error);
                alert('Failed to create batch QRs. Please try again.');
            }
        }

        // Events
        merchantSelect.addEventListener('change', () => {
            loginBtn.disabled = !merchantSelect.value || !passwordInput.value.trim();
        });
        
        passwordInput.addEventListener('input', () => {
            loginBtn.disabled = !merchantSelect.value || !passwordInput.value.trim();
            // Hide error when user starts typing
            loginError.classList.add('hidden');
        });
        
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });
        
        loginBtn.addEventListener('click', login);
        logoutBtn.addEventListener('click', logout);
        qrBox.addEventListener('click', generateNewWithFirebase);
        
        // PDF export events
        document.getElementById('saveSinglePdfBtn').addEventListener('click', saveSingleQRAsPDF);
        document.getElementById('saveTestPdfBtn').addEventListener('click', saveTestQRsAsPDF);
        document.getElementById('saveBatchPdfBtn').addEventListener('click', saveBatchQRsAsPDF);

        // Init
        loginBtn.disabled = true;
        
        // Check for saved login state and auto-login
        const savedMerchantId = localStorage.getItem('mmf_merchant_login');
        if (savedMerchantId && MERCHANTS[savedMerchantId]) {
            // Auto-login with saved merchant
            currentMerchant = MERCHANTS[savedMerchantId];
            merchantName.textContent = currentMerchant.name;
            merchantLogo.src = currentMerchant.logo;
            merchantLogo.alt = currentMerchant.name;
            
            loginScreen.classList.add('hidden');
            qrScreen.classList.remove('hidden');
            
            // Generate initial QR
            generateNewWithFirebase();
        }
        
        // Prevent Safari scaling and zooming
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        document.addEventListener('gesturechange', function(e) {
            e.preventDefault();
        });
        
        document.addEventListener('gestureend', function(e) {
            e.preventDefault();
        });
        
        // Prevent double-tap zoom
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>

</html>
