<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finger Piano — Finger Lab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="exp-page">
  <header class="exp-topbar">
    <a class="back" href="./index.html">← Finger Lab</a>
    <h1>Finger Piano</h1>
    <div class="exp-hud">
      <span>Last note: <strong id="noteLabel">—</strong></span>
    </div>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <span>Starting camera &amp; hand model…</span>
      </div>
      <video id="webcam" playsinline muted></video>
      <canvas id="keys" class="interactive"></canvas>
      <canvas id="overlay" class="overlay"></canvas>
    </div>
  </div>

  <p class="hint-bar">Hover your index fingertip over the white keys · Click anywhere once if you hear no sound (browser audio unlock)</p>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="./js/hands-runtime.js"></script>
  <script src="./js/exp-template.js"></script>
  <script src="./js/finger-piano.js"></script>
</body>
</html>
