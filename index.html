<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchanese Staff Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #2b9348;
            border-radius: 12px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
        }
        h1 {
            color: #2b9348;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            font-weight: 600;
        }
        p {
            color: #6b7280;
            margin-bottom: 2rem;
        }
        .coming-soon {
            background: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            color: #6b7280;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">M</div>
        <h1>Matchanese Staff Portal</h1>
        <p>Your central hub for all staff applications</p>
        <div class="coming-soon">Coming Soon - Staff Homepage</div>
    </div>
</body>
</html>
