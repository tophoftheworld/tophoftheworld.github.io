<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; -webkit-font-smoothing: antialiased; width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; }
  * { box-sizing: border-box; }
  button, input, textarea, select { font-family: inherit; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  .stage { height: 100vh; min-height: 100vh; background: #FFFFFF; overflow: hidden; }
  #root { height: 100vh; min-height: 100vh; overflow: hidden; }
  .viewport-shell {
    position: relative; width: 100%; height: 100vh; min-height: 100vh;
    max-width: 430px; margin: 0 auto; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 8px 48px rgba(0,0,0,0.12);
  }
  @supports (height: 100dvh) {
    .stage, #root, .viewport-shell { height: 100dvh; min-height: 100dvh; }
  }
  /* Desktop centering */
  @media (min-width: 500px) {
    body { background: #F0F0EC; }
    .stage { display: flex; align-items: center; justify-content: center; background: #F0F0EC; }
  }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
