<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matcha Hop – Debug Tools</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <div class="admin-panel" style="max-width:900px;margin:0 auto;">
      <div class="admin-header">
        <h1>Debug Tools</h1>
        <p class="admin-map-view-desc">Inspect and delete posts (logs). This is destructive.</p>
      </div>
      <div class="admin-search-row" style="margin-bottom:12px;">
        <button type="button" id="debug-refresh" class="admin-btn-refresh">Refresh snapshot</button>
        <button type="button" id="debug-clear" class="admin-btn-refresh" style="background:#b42318;border-color:#b42318;">Delete all posts</button>
      </div>
      <p id="debug-status" class="admin-loading" aria-live="polite">Loading...</p>
      <div id="debug-counters"></div>
      <p style="margin-top:16px;">
        <a href="admin.html">Back to admin</a>
      </p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script type="module" src="js/debug-page.js"></script>
</body>
</html>
