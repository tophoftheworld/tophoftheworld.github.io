<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Inventory Management</title>
    <link rel="stylesheet" href="css/style.css?v=1771631255">
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <div class="header-container">
        <div class="date-picker-container">
            <div class="date-picker">
                <button class="date-nav-btn" id="prevDate">‹</button>
                <div class="date-display" id="dateDisplay"></div>
                <button class="date-nav-btn" id="nextDate">›</button>
            </div>
            <div class="branch-picker">
                <select class="branch-select" id="branchSelect">
                    <option value="sm-north">SM North</option>
                    <option value="podium">Podium</option>
                    <option value="moa">MOA</option>
                    <!-- <option value="new-popup">[New Pop-Up]</option> -->
                </select>
            </div>
        </div>
        <div class="toggle-container">
            <div class="toggle-row">
                <div class="toggle-buttons">
                    <button class="toggle-btn active" data-mode="opening">Opening</button>
                    <button class="toggle-btn" data-mode="closing">Closing</button>
                </div>
                <div class="plus-button-container">
                    <button class="add-item-plus-btn" id="addItemPlusBtn">
                        <img src="img/stock-mgmt.png" alt="Stock Management" class="stock-mgmt-icon">
                    </button>
                    <button class="hamburger-btn" id="hamburgerBtn">
                        <img src="img/list.png" alt="Running Low" class="list-icon">
                    </button>
                </div>
            </div>
        </div>
        <div class="admin-container">
            <!-- <button class="admin-btn" id="addItemBtn">Add Item</button> -->
            <!-- <button class="admin-btn" id="addCategoryBtn">Add Category</button> -->
            <!-- <button class="admin-btn" id="reorderBtn">Edit</button> -->
            <button class="admin-btn" id="exportBtn" style="display: none;">Export JSON</button>
            <button class="admin-btn" id="importBtn" style="display: none;">Import JSON</button>
        </div>
        <!-- Hidden file input for JSON import -->
        <input type="file" id="jsonFileInput" accept=".json" style="display: none;">
    </div>

    <div class="scrollable-content">
        <div class="inventory-list">
            <!-- Items will be dynamically loaded here -->
        </div>
    </div>

    <!-- Add Item Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Item</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addItemForm">
                    <div class="form-group">
                        <label for="itemName">Item Name</label>
                        <input type="text" id="itemName" required>
                    </div>
                    <div class="form-group">
                        <label for="itemSubtitle">Subtitle/Brand</label>
                        <input type="text" id="itemSubtitle">
                    </div>
                    <div class="form-group">
                        <label for="itemCategory">Category</label>
                        <select id="itemCategory" required>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="itemUnit">Unit</label>
                        <select id="itemUnit" required>
                            <option value="pcs">pcs</option>
                            <option value="g">g</option>
                            <option value="kg">kg</option>
                            <option value="L">L</option>
                            <option value="ml">ml</option>
                            <option value="pans">Pans</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="initialQuantity">Initial Quantity</label>
                        <input type="number" id="initialQuantity" min="0" step="0.1" value="0" inputmode="decimal" required>
                    </div>
                    <div class="form-group">
                        <label for="restockAmount">Restock Amount</label>
                        <input type="number" id="restockAmount" min="0" step="0.1" value="0" inputmode="decimal">
                    </div>
                    <div class="form-group">
                        <label for="itemPhoto">Photo</label>
                        <input type="file" id="itemPhoto" accept="image/*">
                        <div id="photoPreview" style="margin-top: 10px; display: none;">
                            <img id="previewImage"
                                style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;">
                            <button type="button" id="removePhoto"
                                style="margin-left: 10px; padding: 4px 8px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Remove</button>
                        </div>
                    </div>
                    <div class="form-buttons">
                        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn-add">Add Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Pop-Up Modal -->
    <!-- <div class="modal-overlay" id="addPopupModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Pop-Up</h3>
                <button class="modal-close" id="addPopupModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="newPopupName">Pop-Up Name</label>
                    <input type="text" id="newPopupName" placeholder="Enter pop-up name" required>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-cancel" id="addPopupCancelBtn">Cancel</button>
                    <button type="button" class="btn-add" id="addPopupConfirmBtn">Add Pop-Up</button>
                </div>
            </div>
        </div>
    </div> -->

    <!-- Date Picker Modal -->
    <div class="modal-overlay" id="dateModalOverlay">
        <div class="date-modal">
            <div class="date-modal-header">
                <button class="date-nav-btn" id="modalPrevMonth">‹</button>
                <div class="date-modal-title" id="modalMonthYear">June 2024</div>
                <button class="date-nav-btn" id="modalNextMonth">›</button>
            </div>
            <div class="date-modal-body">
                <div class="date-weekdays">
                    <div class="date-weekday">Sun</div>
                    <div class="date-weekday">Mon</div>
                    <div class="date-weekday">Tue</div>
                    <div class="date-weekday">Wed</div>
                    <div class="date-weekday">Thu</div>
                    <div class="date-weekday">Fri</div>
                    <div class="date-weekday">Sat</div>
                </div>
                <div class="date-grid" id="dateGrid">
                    <!-- Days will be generated here -->
                </div>
            </div>
            <div class="date-modal-footer">
                <button class="btn-cancel" id="dateCancelBtn">Cancel</button>
                <button class="btn-today" id="todayBtn">Today</button>
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div class="modal-overlay" id="addCategoryModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Category</h3>
                <button class="modal-close" id="addCategoryModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="newCategoryName">Category Name</label>
                    <input type="text" id="newCategoryName" placeholder="Enter category name" required>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-cancel" id="addCategoryCancelBtn">Cancel</button>
                    <button type="button" class="btn-add" id="addCategoryConfirmBtn">Add Category</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Mode Switch Confirmation Modal -->
    <div class="modal-overlay" id="modeSwitchModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modeSwitchTitle">Confirm Mode Switch</h3>
                <button class="modal-close" id="modeSwitchModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modeSwitchMessage">Are you sure you want to switch modes?</p>
                <div class="form-buttons">
                    <button type="button" class="btn-cancel" id="modeSwitchCancelBtn">Cancel</button>
                    <button type="button" class="btn-add" id="modeSwitchConfirmBtn">Continue</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Stocks Page -->
    <div class="add-stocks-page" id="addStocksPage">
        <div class="add-stocks-header">
            <button class="back-btn" id="addStocksBackBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h2 class="add-stocks-title">Stock Adjustment</h2>
            <button class="running-low-download-btn" id="stockAdjustmentDownloadBtn" title="Download Report" onclick="if(window.downloadStockAdjustmentReport) { window.downloadStockAdjustmentReport().catch(function(err) { console.error('Download error:', err); alert('Failed to download: ' + (err.message || 'Unknown error')); }); } else { alert('Download feature loading... Please try again in a moment.'); } return false;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        
        <div class="add-stocks-content">
            <div class="stocks-container">
                <div class="stocks-list" id="stocksList">
                    <!-- Stock items will be added here -->
                </div>
                <button class="add-stock-item-btn" id="addStockItemBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Add Items</span>
                </button>
                <div class="subtraction-buttons-container">
                    <button class="pull-out-item-btn" id="pullOutItemBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Pull Out</span>
                    </button>
                    <button class="wastage-item-btn" id="wastageItemBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Wastage</span>
                    </button>
                </div>
                <button class="save-stocks-btn" id="saveStocksBtn" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <polyline points="17,21 17,13 7,13 7,21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <polyline points="7,3 7,8 15,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Save</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Running Low Page -->
    <div class="running-low-page" id="runningLowPage">
        <div class="running-low-header">
            <button class="back-btn" id="runningLowBackBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h2 class="running-low-title">Running Low</h2>
            <button class="running-low-download-btn" id="runningLowDownloadBtn" title="Download Report" onclick="if(window.downloadRunningLowReport) { window.downloadRunningLowReport().catch(function(err) { console.error('Download error:', err); alert('Failed to download: ' + (err.message || 'Unknown error')); }); } else { alert('Download feature loading... Please try again in a moment.'); } return false;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        
        <div class="running-low-content">
            <div class="running-low-container">
                <div class="running-low-list" id="runningLowList">
                    <!-- Running low items will be displayed here -->
                </div>
                <div class="no-items-message" id="noRunningLowMessage" style="display: none;">
                    <div class="no-items-card">
                        <p>No items running low</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Item Selection Modal -->
    <div class="modal-overlay" id="itemSelectionModalOverlay">
        <div class="modal item-selection-modal">
            <div class="modal-header">
                <h3>Select Item</h3>
                <button class="modal-close" id="itemSelectionModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="item-selection-list" id="itemSelectionList">
                    <!-- Items will be populated here -->
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module" src="js/script.js?v=1771631255"></script>
</body>
</html>
