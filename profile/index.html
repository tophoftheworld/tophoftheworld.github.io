<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings • Matchanese Staff Portal</title>
    <link rel="icon" href="../icons/icon-64.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind = { config: {} };
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#2b9348'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #f9fafb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #111827;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 30px -15px rgba(15, 118, 110, 0.35);
            border: 1px solid rgba(17, 24, 39, 0.05);
        }

        .input-focus:focus {
            border-color: #2b9348;
            box-shadow: 0 0 0 3px rgba(43, 147, 72, 0.12);
        }

        .btn-primary {
            background: linear-gradient(135deg, #2b9348 0%, #1d6330 100%);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 25px -15px rgba(34, 197, 94, 0.75);
        }

        .btn-secondary {
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: #f3f4f6;
        }

        .btn-danger {
            background-color: #fee2e2;
            color: #b91c1c;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-danger:hover {
            background-color: #fecaca;
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 9999px;
            border: 1px solid #d1d5db;
            color: #4b5563;
            background: #ffffff;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .icon-button:hover {
            background: #f3f4f6;
            color: #111827;
            border-color: #9ca3af;
        }

        .profile-avatar {
            width: 5rem;
            height: 5rem;
            min-width: 5rem;
            min-height: 5rem;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: linear-gradient(135deg, #2b9348 0%, #1d6330 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: 700;
            box-shadow: 0 6px 20px -10px rgba(34, 197, 94, 0.6);
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .profile-avatar.admin {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 6px 20px -10px rgba(59, 130, 246, 0.6);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .profile-avatar.has-photo span {
            display: none;
        }

        .status-pill {
            background: rgba(43, 147, 72, 0.1);
            color: #2b9348;
            border-radius: 9999px;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .settings-section {
            border-radius: 1rem;
            border: 1px solid rgba(17, 24, 39, 0.05);
            background: #ffffff;
            overflow: hidden;
        }

        .settings-summary {
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.5rem;
            cursor: pointer;
        }

        .settings-summary:focus-visible {
            outline: 3px solid rgba(43, 147, 72, 0.3);
            outline-offset: 2px;
        }

        .settings-summary .summary-text span {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            color: #111827;
        }

        .settings-summary .summary-text p {
            margin-top: 0.25rem;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .settings-summary::marker {
            display: none;
            content: '';
        }

        .settings-summary::after {
            content: '';
            width: 0.75rem;
            height: 0.75rem;
            border: solid #6b7280;
            border-width: 0 2px 2px 0;
            transform: rotate(-45deg);
            transition: transform 0.2s ease;
        }

        details[open] .settings-summary::after {
            transform: rotate(135deg);
        }

        .settings-content {
            border-top: 1px solid #f3f4f6;
            padding: 1.5rem;
        }

        .message {
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            display: none;
        }

        .message-success {
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
            background: rgba(16, 185, 129, 0.1);
            color: #047857;
        }

        .message-error {
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
            background: rgba(220, 38, 38, 0.1);
            color: #b91c1c;
        }

        .message svg {
            flex-shrink: 0;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <header class="flex items-start justify-between gap-4 mb-10">
            <a href="../index.html" class="icon-button" aria-label="Back to portal">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <div class="flex-1">
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Profile Settings</h1>
            </div>
        </header>

        <main class="space-y-8">
            <!-- Overview -->
            <section class="card p-8">
                <div class="flex flex-col items-center text-center gap-6">
                    <div class="profile-avatar" id="profileAvatar">
                        <img id="profileAvatarImage" src="" alt="" style="display: none;">
                        <span id="profileAvatarInitials">SM</span>
                    </div>
                    <div class="w-full">
                        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Signed in as</p>
                        <h2 id="displayName" class="text-3xl font-bold text-gray-900 mb-1">Staff Member</h2>
                        <div class="flex flex-col items-center gap-2 mt-3">
                            <span class="status-pill" id="rolePill">Staff</span>
                            <span class="text-sm text-gray-500">
                                Username: <span id="currentUsername" class="font-semibold text-gray-800">—</span>
                            </span>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-2" style="display: none;">
                        <button type="button" class="btn-secondary inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-gray-200 text-gray-600 text-sm" id="changePhotoButton">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            Change photo
                        </button>
                        <button type="button" class="btn-secondary inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-gray-200 text-gray-500 text-sm" id="removePhotoButton" style="display: none;">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            Remove
                        </button>
                        <input type="file" id="profilePhotoInput" accept="image/*" style="display: none;">
                    </div>
                </div>
            </section>

            <!-- Update username -->
            <section>
                <details id="usernameSection" class="settings-section">
                    <summary class="settings-summary">
                        <div class="summary-text">
                            <span>Update Username</span>
                            <p>Change the username you use to sign in.</p>
                        </div>
                    </summary>
                    <div class="settings-content">
                        <form id="usernameForm" class="space-y-6">
                    <div class="grid gap-4 sm:grid-cols-2">
                        <div class="sm:col-span-2">
                            <label for="newUsername" class="block text-sm font-medium text-gray-700 mb-1">New username</label>
                            <input 
                                id="newUsername"
                                name="newUsername"
                                type="text"
                                required
                                autocomplete="off"
                                class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg outline-none transition duration-150"
                                placeholder="Enter a new username"
                            >
                            <p class="text-xs text-gray-400 mt-2">Use letters, numbers, underscores, or dashes. Avoid spaces and special characters.</p>
                        </div>
                        <div class="sm:col-span-2">
                            <label for="usernameCurrentPassword" class="block text-sm font-medium text-gray-700 mb-1">Current password</label>
                            <input 
                                id="usernameCurrentPassword"
                                name="usernameCurrentPassword"
                                type="password"
                                required
                                autocomplete="current-password"
                                class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg outline-none transition duration-150"
                                placeholder="Enter your current password"
                            >
                        </div>
                    </div>

                    <div id="usernameMessage" class="message"></div>

                    <div class="flex flex-col sm:flex-row sm:justify-end gap-3">
                        <button type="reset" class="btn-secondary px-4 py-2 rounded-lg border border-gray-200 text-gray-600 w-full sm:w-auto" id="usernameReset">
                            Cancel
                        </button>
                        <button type="submit" class="btn-primary text-white px-6 py-3 rounded-lg font-semibold inline-flex items-center justify-center gap-2 w-full sm:w-auto" id="usernameSubmit">
                            <span>Save username</span>
                            <svg class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" id="usernameSpinner">
                                <circle cx="12" cy="12" r="10" stroke-opacity="0.2" stroke-width="4"></circle>
                                <path d="M4 12a8 8 0 018-8" stroke-width="4" stroke-linecap="round"></path>
                            </svg>
                        </button>
                    </div>
                        </form>
                    </div>
                </details>
            </section>

            <!-- Update password -->
            <section>
                <details id="passwordSection" class="settings-section">
                    <summary class="settings-summary">
                        <div class="summary-text">
                            <span>Update Password</span>
                            <p>Choose a strong password you can remember.</p>
                        </div>
                    </summary>
                    <div class="settings-content">
                        <form id="passwordForm" class="space-y-6">
                    <div class="grid gap-4 sm:grid-cols-2">
                        <div class="sm:col-span-2">
                            <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-1">Current password</label>
                            <input 
                                id="currentPassword"
                                name="currentPassword"
                                type="password"
                                required
                                autocomplete="current-password"
                                class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg outline-none transition duration-150"
                                placeholder="Enter your current password"
                            >
                        </div>
                        <div>
                            <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">New password</label>
                            <input 
                                id="newPassword"
                                name="newPassword"
                                type="password"
                                required
                                autocomplete="new-password"
                                minlength="6"
                                class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg outline-none transition duration-150"
                                placeholder="Enter a new password"
                            >
                        </div>
                        <div>
                            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm new password</label>
                            <input 
                                id="confirmPassword"
                                name="confirmPassword"
                                type="password"
                                required
                                autocomplete="new-password"
                                minlength="6"
                                class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg outline-none transition duration-150"
                                placeholder="Re-enter the new password"
                            >
                        </div>
                    </div>

                    <div id="passwordMessage" class="message"></div>

                    <div class="flex flex-col sm:flex-row sm:justify-end gap-3">
                        <button type="reset" class="btn-secondary px-4 py-2 rounded-lg border border-gray-200 text-gray-600 w-full sm:w-auto" id="passwordReset">
                            Cancel
                        </button>
                        <button type="submit" class="btn-primary text-white px-6 py-3 rounded-lg font-semibold inline-flex items-center justify-center gap-2 w-full sm:w-auto" id="passwordSubmit">
                            <span>Save password</span>
                            <svg class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" id="passwordSpinner">
                                <circle cx="12" cy="12" r="10" stroke-opacity="0.2" stroke-width="4"></circle>
                                <path d="M4 12a8 8 0 018-8" stroke-width="4" stroke-linecap="round"></path>
                            </svg>
                        </button>
                    </div>
                        </form>
                    </div>
                </details>
            </section>
        </main>

        <footer class="mt-12">
            <button id="signOutButton" class="btn-danger w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-semibold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Sign Out
            </button>
        </footer>
    </div>

    <script type="module">
        import('../js/profile-settings.js?v=' + Date.now());
    </script>
</body>
</html>
