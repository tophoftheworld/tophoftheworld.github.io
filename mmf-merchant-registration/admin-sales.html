<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMF 2026 — Daily Sales Tally</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
    <div class="admin-gate" id="adminGate">
        <div class="card">
            <h1>Daily Sales Tally</h1>
            <p class="field-hint" style="margin-bottom:1rem;">MMF 2026 — admin access</p>
            <div class="field">
                <label for="adminPassword">Password</label>
                <input class="input" type="password" id="adminPassword" autocomplete="current-password">
                <div class="field-error" id="adminPassError">Incorrect password</div>
            </div>
            <button type="button" class="btn" id="adminLogin" style="width:100%;">Enter</button>
        </div>
    </div>

    <div class="admin-app admin-app--sales hidden" id="adminApp">
        <header class="admin-header">
            <div>
                <h1>Daily Sales Tally</h1>
                <p class="muted" style="margin:0.25rem 0 0;font-size:0.85rem;" id="adminCount">Loading…</p>
            </div>
            <div class="admin-header-actions">
                <a class="btn btn-ghost" href="/admin">← Merchants</a>
                <button type="button" class="btn btn-ghost" id="exportCsvBtn">Export CSV</button>
                <button type="button" class="btn btn-ghost admin-icon-btn" id="adminRefresh" aria-label="Refresh" title="Refresh">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                </button>
                <button type="button" class="btn btn-ghost" id="adminLogout">Log out</button>
            </div>
        </header>

        <main class="admin-sales-main">
            <section class="admin-sales-toolbar">
                <div class="admin-filters">
                    <select id="filterDay" class="admin-filter-select" aria-label="Filter by day">
                        <option value="">All days</option>
                    </select>
                    <select id="filterBrand" class="admin-filter-select" aria-label="Filter by brand">
                        <option value="">All brands</option>
                    </select>
                </div>
                <div class="admin-report-summary" id="summaryGrid"></div>
            </section>

            <section id="dailySections" class="admin-sales-days">
                <div class="admin-loading">Loading sales…</div>
            </section>
        </main>
    </div>

    <script type="module" src="js/admin-sales.js"></script>
</body>
</html>
