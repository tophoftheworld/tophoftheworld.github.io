<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Daily Sales CSV → Podium</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        p { color: #555; margin: 0 0 1rem; font-size: 0.9rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
        input[type="file"] { margin-bottom: 1rem; }
        select { padding: 0.5rem; font-size: 1rem; margin-bottom: 1rem; min-width: 140px; }
        button {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            background: #2b9348;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:disabled { background: #999; cursor: not-allowed; }
        #log {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            max-height: 320px;
            overflow-y: auto;
        }
        .err { color: #c00; }
        .ok { color: #2b9348; }
    </style>
</head>
<body>
    <h1>Upload Daily Sales CSV → Podium</h1>
    <p>Use Utak daily export CSV. Data is written to <code>sales-data/podium/daily</code> (same as Daily Sales form).</p>

    <label for="branch">Branch</label>
    <select id="branch">
        <option value="podium" selected>Podium</option>
        <option value="sm-north">SM North</option>
    </select>

    <label for="file">CSV file</label>
    <input type="file" id="file" accept=".csv" />

    <br />
    <button type="button" id="uploadBtn" disabled>Upload to Firebase</button>

    <div id="log"></div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script type="module">
        import { db } from './js/firebase-setup.js';
        import { doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

        const branchSelect = document.getElementById('branch');
        const fileInput = document.getElementById('file');
        const uploadBtn = document.getElementById('uploadBtn');
        const logEl = document.getElementById('log');

        function log(msg, isErr = false) {
            const line = document.createElement('div');
            line.className = isErr ? 'err' : 'ok';
            line.textContent = msg;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function clearLog() {
            logEl.innerHTML = '';
        }

        /** Parse "31 Oct 2025" -> "2025-10-31" (local date as YYYY-MM-DD) */
        function dayToDocId(dayStr) {
            const d = new Date(dayStr.trim());
            if (isNaN(d.getTime())) return null;
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function parseNum(val) {
            if (val === undefined || val === null || val === '') return 0;
            const s = String(val).replace(/[^\d.-]/g, '').trim();
            const n = parseFloat(s);
            return Number.isFinite(n) ? n : 0;
        }

        /** Map one CSV row (Utak daily format) to Podium daily record */
        function rowToRecord(row, branch) {
            const docId = dayToDocId(row['Day']);
            if (!docId) return null;

            const cash = parseNum(row['Cash']);
            const card = parseNum(row['Card']);
            const grab = parseNum(row['Grab']);
            const qr = parseNum(row['QRPh']);
            const giftCard = parseNum(row['GiftCard']);
            const expenses = parseNum(row['Expense']);

            const walkInSales = cash + card + qr + giftCard;
            const totalSales = walkInSales + grab;
            const calculatedCashLeft = cash - expenses;

            if (branch === 'podium') {
                return {
                    dateDisplay: (row['Day'] || '').trim(),
                    cash,
                    card,
                    qr,
                    giftCard,
                    grab,
                    expenses,
                    nonCashExpenses: 0,
                    walkInSales,
                    totalSales,
                    calculatedCashLeft,
                    actualCashLeft: calculatedCashLeft,
                    cashVariance: 0,
                    staff: 'CSV import',
                    timestamp: serverTimestamp()
                };
            }
            // SM North: no qr/giftCard, use gcash/maya from CSV if present (Utak may use different names)
            const gcash = parseNum(row['GCash'] ?? row['Gcash'] ?? 0);
            const maya = parseNum(row['Maya'] ?? 0);
            const walkIn = cash + card + gcash + maya;
            return {
                dateDisplay: (row['Day'] || '').trim(),
                cash,
                card,
                gcash,
                maya,
                grab,
                expenses,
                walkInSales: walkIn,
                totalSales: walkIn + grab,
                calculatedCashLeft,
                actualCashLeft: calculatedCashLeft,
                cashVariance: 0,
                staff: 'CSV import',
                timestamp: serverTimestamp()
            };
        }

        fileInput.addEventListener('change', () => {
            uploadBtn.disabled = !fileInput.files.length;
        });

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            const branch = branchSelect.value;
            clearLog();
            log(`Branch: ${branch}. Parsing CSV...`);

            const text = await file.text();
            const result = Papa.parse(text, { header: true, skipEmptyLines: true });

            if (result.errors.length) {
                result.errors.forEach(e => log(`Parse: ${e.message}`, true));
            }

            const rows = result.data || [];
            if (!rows.length) {
                log('No rows in CSV.', true);
                return;
            }

            const records = [];
            for (const row of rows) {
                const rec = rowToRecord(row, branch);
                if (rec) records.push(rec);
            }

            const docIds = rows.map(r => dayToDocId(r['Day'])).filter(Boolean);
            const uniqueIds = [...new Set(docIds)];
            if (records.length !== uniqueIds.length) {
                log(`Mapped ${records.length} records from ${rows.length} rows (some dates skipped).`);
            }

            uploadBtn.disabled = true;
            log(`Uploading ${records.length} days to sales-data/${branch}/daily ...`);

            let ok = 0;
            let err = 0;
            for (let i = 0; i < rows.length; i++) {
                const rec = rowToRecord(rows[i], branch);
                if (!rec) continue;
                const docId = dayToDocId(rows[i]['Day']);
                try {
                    const ref = doc(db, 'sales-data', branch, 'daily', docId);
                    await setDoc(ref, rec);
                    log(`  ${docId}  ₱${rec.totalSales.toLocaleString('en-PH', { minimumFractionDigits: 2 })}`);
                    ok++;
                } catch (e) {
                    log(`  ${docId} FAILED: ${e.message}`, true);
                    err++;
                }
            }

            log('');
            log(`Done. ${ok} uploaded, ${err} failed.`);
            uploadBtn.disabled = false;
        });
    </script>
</body>
</html>
