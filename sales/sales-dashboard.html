<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matchanese Sales Dashboard</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"
        integrity="sha512-ElRFoEQdI5Ht6kZvyzXhYG9NqjtkmlkfYk0wr6wHxU9JEHakS7UJZNeml5ALk+8IKlU6jDgMabC3vkumRokgJA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" src="./js/firebase-setup.js"></script>
    <style>
        /* Mobile-specific overrides */
        @media (max-width: 768px) {
            body {
                padding: 0.5rem !important;
                margin: 0 !important;
            }
            
            .container {
                max-width: 100% !important;
                margin: 0 !important;
            }
            
            .admin-header {
                margin-bottom: 0.5rem !important;
                padding: 0.5rem !important;
            }
            
            .app-title {
                display: none !important;
            }
            
            .summary-cards {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)) !important;
                gap: 0.3rem !important;
                margin-bottom: 0.5rem !important;
            }
            
            .summary-card {
                padding: 0.5rem !important;
            }
            
            .card-title {
                font-size: 0.7rem !important;
                margin-bottom: 0.2rem !important;
            }
            
            .card-value {
                font-size: 0.9rem !important;
            }
            
            .main-controls, .chart-controls {
                padding: 0.4rem !important;
                margin-bottom: 0.5rem !important;
            }
            
            #salesChartContainer {
                height: 200px !important;
                padding: 0.4rem !important;
                margin: 0.5rem 0 !important;
            }
            
            /* Hide table columns */
            table th:nth-child(2),
            table td:nth-child(2),
            table th:nth-child(3),
            table td:nth-child(3) {
                display: none !important;
            }
            
            table {
                font-size: 0.7rem !important;
            }
            
            th, td {
                padding: 0.3rem 0.25rem !important;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 0.3rem !important;
            }
            
            .summary-cards {
                grid-template-columns: 1fr 1fr !important;
                gap: 0.25rem !important;
            }
            
            .summary-card {
                padding: 0.4rem !important;
            }
            
            .card-title {
                font-size: 0.65rem !important;
            }
            
            .card-value {
                font-size: 0.8rem !important;
            }
            
            #salesChartContainer {
                height: 180px !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="admin-header">
            <div class="logo-section">
                <img src="img/matchanese-logo.png" class="logo" alt="Matchanese Logo">
                <h1 class="app-title">Sales Dashboard</h1>
            </div>
            <div class="branch-selector">
                <span class="branch-label">Branch:</span>
                <select class="branch-dropdown" id="branchSelector">
                    <option value="sm-north">SM North</option>
                    <option value="podium">Podium</option>
                </select>
            </div>
            <div class="import-section" id="importSection" style="display: block;">
                <span class="import-label">Import CSV:</span>
                <input type="file" id="csvFileInput" accept=".csv" />
                <button class="import-btn" id="importBtn" disabled>Import Data</button>
                <div class="import-status" id="importStatus"></div>
            </div>
        </div>
        
        <div class="controls">
            <!-- Remove the old controls div content -->
        </div>

        <div class="summary-cards" id="summaryCards"></div>

        <div id="salesChartContainer">
            <canvas id="salesChart"></canvas>
        </div>

        <div class="main-controls">
            <div class="view-selector">
                <button class="view-btn active" data-view="daily">Daily</button>
                <button class="view-btn" data-view="weekly">Weekly</button>
                <button class="view-btn" data-view="monthly">Monthly</button>
            </div>
        
            <div class="date-shortcuts" id="dateShortcuts"></div>
        
            <input type="text" id="dateRange" placeholder="Select date range" />
        </div>

        <div class="chart-controls">
            <div class="chart-options">
                <!-- <span class="control-label">Chart Display:</span> -->
                <div class="option-buttons" id="chartDisplayOptions">
                    <button class="option-btn active" data-type="total">Total Sales</button>
                    <button class="option-btn" data-type="walkin">Walk-In Only</button>
                    <button class="option-btn" data-type="grab">Grab Only</button>
                </div>
            </div>
        
            <div class="projection-options">
                <!-- <span class="control-label">Projections:</span> -->
                <div class="option-buttons">
                    <button class="option-btn" id="projectionToggle" disabled>Show Projections</button>
                    <button class="option-btn active" id="currentMonthToggle" disabled>Hide Current Month</button>
                </div>
            </div>
        </div>

        <div class="data-table-container">
            <table>
                <thead>
                    <tr id="tableHeaders">
                        <!-- Headers will be dynamically generated -->
                    </tr>
                </thead>
                <tbody id="salesTableBody"></tbody>
            </table>
        </div>
    </div>

    <script type="module" src="js/dashboard.js?v=2"></script>
</body>

</html>
