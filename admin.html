<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Matchanese Admin Dashboard</title>
    <link rel="icon" href="icons/icon-64.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Suppress Tailwind CDN warning for development
        window.tailwind = { config: {} };
        
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#2b9348'
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth transitions for collapse animation */
        .nav-item span {
            transition: opacity 0.2s ease, width 0.2s ease, margin-left 0.2s ease;
        }
        
        #collapseIcon {
            transition: transform 0.2s ease;
        }
        
        #sidebar {
            transition: width 0.2s ease;
        }
        
        /* Make active tab non-clickable */
        .nav-item.active {
            cursor: default;
            pointer-events: none;
        }
        
        .nav-item.active:hover {
            background-color: #f0fdf4 !important;
            color: #2b9348 !important;
        }

        /* Mobile Navigation Styles */
        @media (max-width: 768px) {
            #sidebar {
                display: none !important;
            }
            
            .main-content-mobile {
                margin-left: 0 !important;
                padding: 0.5rem !important;
            }
            
            .mobile-nav {
                display: block;
            }
        }

        @media (min-width: 769px) {
            .mobile-nav {
                display: none !important;
            }
        }

        /* Mobile Navigation Bar */
        .mobile-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .mobile-nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
        }

        .mobile-logo-icon {
            height: 2rem;
        }

        .mobile-logo-full-header {
            height: 2rem;
        }

        .mobile-page-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2b9348;
        }

        .mobile-profile-avatar {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .mobile-profile-avatar:hover {
            transform: scale(1.05);
        }

        .mobile-menu-toggle {
            background: none;
            border: none;
            padding: 0.5rem;
            color: #2b9348;
            cursor: pointer;
            border-radius: 0.375rem;
            transition: background-color 0.2s;
        }

        .mobile-menu-toggle:hover {
            background-color: #f0fdf4;
        }

        .mobile-nav-divider {
            height: 1px;
            background-color: #f3f4f6;
            margin: 0.5rem 0;
        }

        .mobile-logout-button {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            border-bottom: none;
            text-decoration: none;
            color: #dc2626;
            transition: background-color 0.2s;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .mobile-logout-button:hover {
            background-color: #fef2f2;
        }

        .mobile-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .mobile-dropdown.open {
            max-height: 500px;
        }


        .mobile-nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            border-bottom: 1px solid #f3f4f6;
            text-decoration: none;
            color: #374151;
            transition: background-color 0.2s;
        }

        .mobile-nav-item:last-child {
            border-bottom: none;
        }

        .mobile-nav-item:hover {
            background-color: #f9fafb;
        }

        .mobile-nav-item.active {
            background-color: #f0fdf4;
            color: #2b9348;
            font-weight: 600;
        }

        .mobile-nav-icon {
            width: 1.25rem;
            height: 1.25rem;
            flex-shrink: 0;
        }

        .mobile-nav-text {
            font-size: 1rem;
            font-weight: 500;
        }

        /* Mobile content padding */
        .mobile-content-padding {
            padding-top: 0;
        }
        
        @media (max-width: 768px) {
            .mobile-content-padding {
                padding-top: 4.5rem;
            }
        }
        
        /* Desktop content padding - remove extra top padding */
        @media (min-width: 769px) {
            .main-content-mobile {
                padding-top: 2rem !important;
            }
        }
    </style>
</head>

    <script>
        // Simple JavaScript to handle the functionality
        let collapsed = localStorage.getItem('sidebarCollapsed') === 'true';
        let active = localStorage.getItem('activeApp') || "Payroll";

        const sidebar = document.getElementById('sidebar');
        const collapseBtn = document.getElementById('collapseBtn');
        const collapseIcon = document.getElementById('collapseIcon');
        const logoFull = document.getElementById('logoFull');
        const logoIcon = document.getElementById('logoIcon');
        const navItems = document.querySelectorAll('.nav-item');
        const activeApp = document.getElementById('activeApp');

        // Toggle sidebar
        collapseBtn.addEventListener('click', () => {
            collapsed = !collapsed;
            
            // Save to localStorage
            localStorage.setItem('sidebarCollapsed', collapsed);
            
            if (collapsed) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-24');
                logoFull.style.display = 'none';
                logoIcon.style.display = 'block';
                collapseIcon.style.transform = 'rotate(180deg)';
                
                // Update nav items for collapsed state - keep same padding
                navItems.forEach(item => {
                    const span = item.querySelector('span');
                    if (span) {
                        span.style.opacity = '0';
                        span.style.width = '0';
                        span.style.marginLeft = '0';
                    }
                    item.classList.remove('justify-start');
                    item.classList.add('justify-center');
                });
                
                // Hide user details in collapsed state and center the profile photo
                const userDetails = document.getElementById('userDetails');
                const logoutText = document.getElementById('logoutText');
                const userInfo = document.getElementById('userInfo');
                if (userDetails) userDetails.style.display = 'none';
                if (logoutText) logoutText.style.display = 'none';
                if (userInfo) {
                    userInfo.classList.remove('flex-col', 'items-center');
                    userInfo.classList.add('flex', 'justify-center');
                }
            } else {
                sidebar.classList.remove('w-24');
                sidebar.classList.add('w-64');
                logoFull.style.display = 'block';
                logoIcon.style.display = 'none';
                collapseIcon.style.transform = 'rotate(0deg)';
                
                // Update nav items for expanded state
                navItems.forEach(item => {
                    const span = item.querySelector('span');
                    if (span) {
                        span.style.opacity = '1';
                        span.style.width = 'auto';
                        span.style.marginLeft = '0';
                    }
                    item.classList.add('justify-start');
                    item.classList.remove('justify-center');
                });
                
                // Show user details in expanded state and restore vertical layout
                const userDetails = document.getElementById('userDetails');
                const logoutText = document.getElementById('logoutText');
                const userInfo = document.getElementById('userInfo');
                if (userDetails) userDetails.style.display = 'block';
                if (logoutText) logoutText.style.display = 'inline';
                if (userInfo) {
                    userInfo.classList.remove('flex', 'justify-center');
                    userInfo.classList.add('flex-col', 'items-center');
                }
            }
        });

        // App configurations
        const appConfigs = {
            'Payroll': {
                url: 'admin-payroll/index.html',
                title: 'Payroll Management'
            },
            'Staff': {
                url: 'admin-staff/index.html',
                title: 'Staff Management'
            },
            'Schedule': {
                url: 'schedule/index.html',
                title: 'Staff Scheduling'
            },
            'Matcha supply': {
                url: 'matcha-supply/index.html',
                title: 'Matcha Supply Planner'
            },
            'Sales': {
                url: 'sales/sales-dashboard.html',
                title: 'Sales Analytics'
            },
            'Expenses': {
                url: 'expenses/admin.html',
                title: 'Expense Management'
            },
            'Inventory': {
                url: 'inventory/admin.html',
                title: 'Inventory Management'
            },
            'Pop-ups': {
                url: 'pos/dashboard.html',
                title: 'POS & Pop-ups'
            },
            'Reports': {
                url: 'reports/index.html',
                title: 'Quarterly Reports'
            },
            'Requests': {
                url: 'admin-requests/index.html',
                title: 'Payroll Requests'
            }
        };

        // Handle nav item clicks
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const appName = item.dataset.app;
                
                // Don't do anything if this is already the active tab
                if (appName === active) {
                    return;
                }
                
                // Allow navigation for all users - permission check happens at content level
                
                // Update active state
                navItems.forEach(nav => {
                    nav.classList.remove('active', 'text-emerald-700');
                    nav.classList.add('text-gray-700', 'hover:text-emerald-600');
                    nav.style.backgroundColor = '';
                    nav.style.color = '';
                });
                
                item.classList.add('active', 'text-emerald-700');
                item.classList.remove('text-gray-700', 'hover:text-emerald-600');
                item.style.backgroundColor = '#f0fdf4';
                item.style.color = '#2b9348';
                
                // Update active app
                active = appName;
                activeApp.textContent = appName;
                
                // Save to localStorage for persistence
                localStorage.setItem('activeApp', appName);
                
                // Load the actual app
                loadApp(appName);
            });
        });

        // Function to load the actual admin app
        function loadApp(appName) {
            const config = appConfigs[appName];
            if (!config) return;
            
            // Check if user has permission to access this tab
            if (typeof checkTabPermission === 'function' && !checkTabPermission(appName)) {
                // Show access denied for this specific tab
                showTabAccessDenied(appName);
                return;
            }
            
            // Create iframe to embed the app
            const mainContent = document.querySelector('main');
            const contentPlaceholder = mainContent.querySelector('#dashboardContent');
            
            // Remove existing iframe if any
            const existingIframe = mainContent.querySelector('iframe');
            if (existingIframe) {
                existingIframe.remove();
            }
            
            // Remove any existing access denied message
            const existingAccessDenied = mainContent.querySelector('.access-denied-message');
            if (existingAccessDenied) {
                existingAccessDenied.remove();
            }
            
            // Create new iframe with cache-busting
            const iframe = document.createElement('iframe');
            
            // Add cache-busting parameter to force reload
            const cacheBuster = '?v=' + Date.now();
            const adminParam = appName === 'Schedule' ? '&admin=true' : '';
            iframe.src = config.url + cacheBuster + adminParam;
            
            iframe.className = 'w-full h-full border-0';
            iframe.style.borderRadius = '0.5rem';
            iframe.style.display = 'block';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.minHeight = '600px';
            
            // Hide placeholder and show iframe
            if (contentPlaceholder) {
                contentPlaceholder.style.display = 'none';
            }
            mainContent.appendChild(iframe);
            
            // Handle iframe load success
            iframe.onload = () => {
                console.log(`Successfully loaded ${appName} app with cache-busting`);
            };
            
            // Handle iframe load errors
            iframe.onerror = () => {
                if (contentPlaceholder) {
                    contentPlaceholder.style.display = 'flex';
                }
                iframe.remove();
                activeApp.textContent = `${appName} (Error loading)`;
            };
        }
        
        // Show access denied message for specific tab
        function showTabAccessDenied(tabName) {
            const mainContent = document.querySelector('main');
            const contentPlaceholder = mainContent.querySelector('#dashboardContent');
            
            // Remove existing iframe if any
            const existingIframe = mainContent.querySelector('iframe');
            if (existingIframe) {
                existingIframe.remove();
            }
            
            // Remove any existing access denied message
            const existingAccessDenied = mainContent.querySelector('.access-denied-message');
            if (existingAccessDenied) {
                existingAccessDenied.remove();
            }
            
            // Hide placeholder
            if (contentPlaceholder) {
                contentPlaceholder.style.display = 'none';
            }
            
            // Create and show access denied message
            const accessDeniedDiv = document.createElement('div');
            accessDeniedDiv.className = 'access-denied-message flex items-center justify-center h-full';
            accessDeniedDiv.innerHTML = `
                <div class="text-center max-w-md">
                    <div class="text-6xl mb-4">🔒</div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Access Denied</h2>
                    <p class="text-gray-600">You don't have permission to access ${tabName}.</p>
                </div>
            `;
            
            mainContent.appendChild(accessDeniedDiv);
        }

        // Initialize the dashboard on page load
        function initializeDashboard() {
            // Check localStorage for last selected app first
            const lastSelectedApp = localStorage.getItem('activeApp');
            
            if (lastSelectedApp && typeof checkTabPermission === 'function' && checkTabPermission(lastSelectedApp)) {
                // User has permission for the last selected app
                active = lastSelectedApp;
            } else {
                // Find the first accessible app as fallback
                const firstAccessibleApp = findFirstAccessibleApp();
                if (firstAccessibleApp) {
                    active = firstAccessibleApp;
                    localStorage.setItem('activeApp', active);
                }
            }
            
            // Update the active app display
            activeApp.textContent = active;
            
            // Set the correct active state for the current app
            navItems.forEach(item => {
                if (item.dataset.app === active) {
                    item.classList.add('active', 'text-emerald-700');
                    item.classList.remove('text-gray-700', 'hover:text-emerald-600');
                    item.style.backgroundColor = '#f0fdf4';
                    item.style.color = '#2b9348';
                } else {
                    item.classList.remove('active', 'text-emerald-700');
                    item.classList.add('text-gray-700', 'hover:text-emerald-600');
                    item.style.backgroundColor = '';
                    item.style.color = '';
                }
            });
            
            // Load the first accessible app
            loadApp(active);
        }
        
        // Find the first app the user has access to
        function findFirstAccessibleApp() {
            const appOrder = ['Payroll', 'Requests', 'Staff', 'Schedule', 'Matcha supply', 'Sales', 'Expenses', 'Inventory', 'Pop-ups', 'Reports'];
            
            for (const appName of appOrder) {
                if (typeof checkTabPermission === 'function' && checkTabPermission(appName)) {
                    console.log(`Found first accessible app: ${appName}`);
                    return appName;
                }
            }
            
            console.log('No accessible apps found');
            return null;
        }

        // Make initializeDashboard globally available
        window.initializeDashboard = initializeDashboard;

        // Apply saved sidebar state on page load
        function applySavedSidebarState() {
            if (collapsed) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-24');
                logoFull.style.display = 'none';
                logoIcon.style.display = 'block';
                collapseIcon.style.transform = 'rotate(180deg)';
                
                // Update nav items for collapsed state
                navItems.forEach(item => {
                    const span = item.querySelector('span');
                    if (span) {
                        span.style.opacity = '0';
                        span.style.width = '0';
                        span.style.marginLeft = '0';
                    }
                    item.classList.remove('justify-start');
                    item.classList.add('justify-center');
                });
                
                // Hide user details in collapsed state
                const userDetails = document.getElementById('userDetails');
                const logoutText = document.getElementById('logoutText');
                const userInfo = document.getElementById('userInfo');
                if (userDetails) userDetails.style.display = 'none';
                if (logoutText) logoutText.style.display = 'none';
                if (userInfo) {
                    userInfo.classList.remove('flex-col', 'items-center');
                    userInfo.classList.add('flex', 'justify-center');
                }
            }
        }

        // Apply saved state when page loads
        applySavedSidebarState();

        // Mobile Navigation Functionality
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const mobileDropdown = document.getElementById('mobileDropdown');
        const mobileNavItems = document.querySelectorAll('.mobile-nav-item');
        const mobilePageTitle = document.getElementById('mobilePageTitle');
        const mobileLogoutButton = document.getElementById('mobileLogoutButton');
        const mobileLogoIcon = document.getElementById('mobileLogoIcon');
        const mobileLogoFullHeader = document.getElementById('mobileLogoFullHeader');

        // Toggle mobile dropdown
        if (mobileMenuToggle && mobileDropdown) {
            mobileMenuToggle.addEventListener('click', () => {
                const isOpen = mobileDropdown.classList.contains('open');
                mobileDropdown.classList.toggle('open');
                
                // Toggle logo display
                if (!isOpen) {
                    // Opening dropdown - show full logo, hide icon+title
                    mobileLogoIcon.style.display = 'none';
                    mobilePageTitle.style.display = 'none';
                    mobileLogoFullHeader.style.display = 'block';
                } else {
                    // Closing dropdown - show icon+title, hide full logo
                    mobileLogoIcon.style.display = 'block';
                    mobilePageTitle.style.display = 'block';
                    mobileLogoFullHeader.style.display = 'none';
                }
            });
        }

        // Handle mobile logout
        if (mobileLogoutButton) {
            mobileLogoutButton.addEventListener('click', () => {
                // Use the same logout functionality as desktop
                if (typeof logout === 'function') {
                    logout();
                } else {
                    // Fallback logout
                    window.location.href = 'admin-login.html';
                }
            });
        }

        // Handle mobile nav item clicks
        mobileNavItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const appName = item.dataset.app;
                
                // Don't do anything if this is already the active tab
                if (appName === active) {
                    mobileDropdown.classList.remove('open');
                    return;
                }
                
                // Update mobile nav active state
                mobileNavItems.forEach(nav => {
                    nav.classList.remove('active');
                });
                item.classList.add('active');
                
                // Update desktop nav active state (in case user switches between mobile/desktop)
                navItems.forEach(nav => {
                    if (nav.dataset.app === appName) {
                        nav.classList.remove('text-gray-700', 'hover:text-emerald-600');
                        nav.classList.add('active', 'text-emerald-700');
                        nav.style.backgroundColor = '#f0fdf4';
                        nav.style.color = '#2b9348';
                    } else {
                        nav.classList.remove('active', 'text-emerald-700');
                        nav.classList.add('text-gray-700', 'hover:text-emerald-600');
                        nav.style.backgroundColor = '';
                        nav.style.color = '';
                    }
                });
                
                // Update active app
                active = appName;
                activeApp.textContent = appName;
                
                // Update mobile page title
                if (mobilePageTitle) {
                    mobilePageTitle.textContent = appName;
                }
                
                // Save to localStorage for persistence
                localStorage.setItem('activeApp', appName);
                
                // Load the actual app
                loadApp(appName);
                
                // Close mobile dropdown and restore icon+title display
                mobileDropdown.classList.remove('open');
                mobileLogoIcon.style.display = 'block';
                mobilePageTitle.style.display = 'block';
                mobileLogoFullHeader.style.display = 'none';
            });
        });

        // Close mobile dropdown when clicking outside
        document.addEventListener('click', (e) => {
            // Close nav dropdown
            if (mobileDropdown && mobileMenuToggle && 
                !mobileDropdown.contains(e.target) && 
                !mobileMenuToggle.contains(e.target)) {
                mobileDropdown.classList.remove('open');
                // Restore icon+title display
                mobileLogoIcon.style.display = 'block';
                mobilePageTitle.style.display = 'block';
                mobileLogoFullHeader.style.display = 'none';
            }
        });

        // Update mobile nav active state on initialization
        function updateMobileNavActiveState() {
            mobileNavItems.forEach(item => {
                if (item.dataset.app === active) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Override the initializeDashboard function to also update mobile nav
        const originalInitializeDashboard = window.initializeDashboard;
        window.initializeDashboard = function() {
            originalInitializeDashboard();
            updateMobileNavActiveState();
            
            // Update mobile page title
            if (mobilePageTitle) {
                mobilePageTitle.textContent = active;
            }
        };
    </script>
</body>
</html>
