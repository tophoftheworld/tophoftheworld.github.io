<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Matchanese Daily Sales Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 380px;
            width: 100%;
            background: #fff;
            padding: 2rem 1.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            margin: 3rem auto;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            text-align: center;
            color: #222;
        }

        .logo {
            display: block;
            margin: 0 auto 0.75rem;
            height: 60px;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            display: block;
            margin: 0.25rem 0 0.5rem;
            color: #333;
        }

        input[type="text"],
        select {
            width: 100% !important;
            -webkit-appearance: none;
            appearance: none;
        }

        input,
        select {
            padding: 0.85rem 1rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #fff;
            transition: transform 0.15s ease;
        }

        input,
        select,
        .input-wrapper input,
        #totalDisplay {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }


        input:focus,
        select:focus {
            outline: none;
            border-color: #2b9348;
            box-shadow: 0 0 0 2px #2b934850;
            transform: scale(1.05);
        }


        .total-sales-display {
            margin-top: 1.2rem;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            color: #137a2f;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-wrapper span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            font-size: 1rem;
        }

        .input-wrapper input {
            padding-left: 2rem;
        }


        #recordDate {
            /* background-color: #eaffea; */
            font-weight: 500;
            text-align: center;
            font-size: 1rem;
            color: #111;
        }

        .group-card {
            background: #f9f9f9;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            padding-left: 1rem;
            padding-right: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            margin-top: 1rem;
        }

        .subheader {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.75rem;
            margin-top: 1rem;
            color: #444;
        }

        #totalDisplay {
            background-color: #dbffe6;
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            color: #137a2f;
            border: 2px solid #b6e8c1;
            border-radius: 10px;
            margin-top: 0rem;
            margin-bottom: 0rem;
        }

        #cashLeft {
            background-color: #eaffea;
            font-size: 1.2rem;
            font-weight: 800;
            text-align: center;
            color: #208f34;
            border: 2px solid #b6e8c1;
            border-radius: 10px;
        }

        
        input:read-only {
            /* background-color: #f3fff5; */
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
            background-color: #2b9348;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 1.5rem;
        }

        button:hover:not([disabled]) {
            background-color: #238636;
        }

        select {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 0.85rem 1rem;
            font-size: 1rem;
            font-family: inherit;
        }
        
        @media (max-width: 480px) {
            .container {
                margin-top: 0 !important;
            }
        }

        /* Fix Flatpickr input width on mobile Safari */
        .flatpickr-input,
        input#recordDate {
            width: 100% !important;
            max-width: 100% !important;
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
            font-size: 1rem;
            padding: 0.85rem 1rem;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .split-row {
        display: flex;
        gap: 10px;
        margin-bottom: 0.25rem;
        }

        .split-column {
        flex: 1;
        min-width: 0;
        }
        
        .split-row .input-wrapper {
            width: 100%;
        }

        #walkInSales {
            background-color: #eaffea;
            font-size: 1.2rem;  /* Match the cash left size */
            font-weight: 800;   /* Match the cash left weight */
            text-align: center;
            color: #208f34;
            border: 2px solid #b6e8c1;
            border-radius: 10px;
        }
        
    </style>
</head>

<body>
    <div class="container">


        <!-- <input type="file" id="csvUploader" accept=".csv" style="display:none" />
        <button id="uploadCSVBtn" style="margin-top: 1rem;">Upload CSV</button> -->

        <input type="file" id="grabCSVUploader" accept=".csv" style="display:none" />
        <button id="uploadGrabCSVBtn" style="margin-top: 1rem; display: none;">Upload Grab CSV</button>
        
        <div class="split-row">
            <div class="split-column">
                <label for="branchSelect">Branch</label>

                    <option value="sm-north">SM North</option>

            <div class="split-column">

                <input type="text" id="recordDate" readonly />
            </div>
        </div>

        <!-- Payments -->
        <label for="totalDisplay">Total Sales</label>
        <input type="text" id="totalDisplay" readonly value="₱0.00" />
        
        <!-- Add this new divided row section -->
        <div class="split-row">
            <div class="split-column">
                <label for="walkInSales">Walk-In Sales</label>
                <input type="text" id="walkInSales" readonly value="₱0.00" />
            </div>
            <div class="split-column">
                <label for="cashLeft">Cash Left</label>
                <input type="text" id="cashLeft" readonly value="₱0.00" />
            </div>
        </div>
        <div class="group-card" id="paymentFieldsContainer">
            <!-- Payment fields will be dynamically inserted here -->
        </div>

        <div class="group-card" id="expensesContainer">
            <!-- Expenses fields will be dynamically inserted here -->
        </div>

        <div class="group-card" id="cashReconciliationContainer">
            <!-- Cash reconciliation fields will be dynamically inserted here -->
        </div>

        <!-- Form section (shown when no data exists or in edit mode) -->
        <div id="formSection">
            <button id="cancelEditBtn" onclick="cancelEdit()" style="width: 100%; padding: 0.85rem; font-size: 1rem; background-color: #e0e0e0; color: #333; border: none; border-radius: 10px; cursor: pointer; transition: background 0.2s ease; margin-bottom: 0.5rem; display: none;">
                Cancel
            </button>
            <button onclick="checkExistingAndShowSummary()">Submit</button>
        </div>

        <!-- Summary view section (shown when data exists) -->
        <div id="summarySection" style="display: none;">
            <div id="existingDataSummary" style="margin: 1.5rem 0; padding: 1.5rem; background: #f9f9f9; border-radius: 12px;">
                <!-- Summary content will be inserted here -->
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0;">
                <button onclick="downloadExistingSummary()" style="width: 100%; padding: 0.85rem; font-size: 1rem; background-color: #4a90e2; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: background 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download Full Summary
                </button>
                <button onclick="editExistingData()" style="width: 100%; padding: 0.85rem; font-size: 1rem; background-color: #2b9348; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: background 0.2s ease;">
                    Edit
                </button>
            </div>
        </div>
                    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; flex-direction: column;" onclick="handleModalBackdropClick(event, 'confirmModal')">
        <div style="background: white; border-radius: 16px; padding: 2rem; max-width: 500px; width: calc(90% - 4rem); margin: 2rem; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.2); position: relative;" onclick="event.stopPropagation()">
            <button onclick="closeConfirmModal()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; cursor: pointer; padding: 0.5rem; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; color: #666; font-size: 1.5rem; line-height: 1;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 style="margin-top: 0; margin-bottom: 0.5rem; color: #2b9348; font-size: 0.95rem; font-weight: 600;">Confirm Submission</h2>
            <div id="confirmSummary" style="margin: 0; line-height: 1.56;"></div>
            <div id="overwriteWarning" style="display: none; background: #fff3cd; border: 1px solid #ffc107; padding: 1rem; border-radius: 8px; margin: 1rem 0; color: #856404;">
                <strong>⚠️ Warning:</strong> A record already exists for this date and branch. This will overwrite the existing data.
                </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button onclick="closeConfirmModal()" style="flex: 1; padding: 0.75rem; background: #e0e0e0; color: #333; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600;">Cancel</button>
                <button onclick="confirmSubmit()" style="flex: 1; padding: 0.75rem; background: #2b9348; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600;">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Success Summary Modal -->
    <div id="successModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; flex-direction: column;" onclick="handleModalBackdropClick(event, 'successModal')">
        <div id="successModalContent" style="background: white; border-radius: 16px; padding: 2rem; max-width: 500px; width: calc(90% - 4rem); margin: 2rem; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.2); position: relative;" onclick="event.stopPropagation()">
            <button onclick="closeSuccessModal()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; cursor: pointer; padding: 0.5rem; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; color: #666; font-size: 1.5rem; line-height: 1;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 style="margin-top: 0; margin-bottom: 0.5rem; color: #2b9348; font-size: 0.95rem; text-align: center; font-weight: 600;">✅ Sales Submitted Successfully!</h2>
            <div id="successSummary" style="margin: 0; line-height: 1.56; text-align: center;"></div>
            <div id="successModalButtons" style="text-align: center; margin-top: 1rem; display: flex; gap: 0.75rem; justify-content: center;">
                <button onclick="downloadSalesSummary()" style="padding: 0.75rem 2rem; background: #4a90e2; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; margin: 0 auto;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download
                </button>
            </div>
        </div>
    </div>

    <div id="toast" style="
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #2b9348;
      color: #fff;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 9999;
    "></div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module">
        import { db } from './js/firebase-setup.js';
        import {
                collection,
            setDoc,
            doc,
            getDoc, // ✅ add this
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";


        // Get user nickname from localStorage
        let currentUserNickname = localStorage.getItem("loggedInUser") || "";
        let currentBranch = "sm-north";

        // Function to map attendance branch names to sales branch values
        function mapBranchNameToValue(branchName) {
            if (!branchName) return null;
            const lower = branchName.toLowerCase();
            if (lower.includes("sm north") || lower.includes("smnorth")) {
                return "sm-north";
            } else if (lower.includes("podium")) {
                return "podium";
            }
            return null;
        }

        // Function to check attendance and auto-select branch
        window.checkAttendanceAndSetBranch = async function() {
            // Update currentUserNickname in case it wasn't set yet
            const userId = localStorage.getItem("loggedInUser") || "";
            if (!userId) {
                // No user logged in, use default
                const branchSelect = document.getElementById("branchSelect");
                if (branchSelect && !branchSelect.value) {
                    branchSelect.value = "sm-north";
                    if (window.handleBranchChange) {
                        window.handleBranchChange();
                    }
                }
                return;
            }

            const selectedDate = flatpickrInstance?.selectedDates[0] || new Date();
            const dateKey = selectedDate.toLocaleDateString('en-CA'); // YYYY-MM-DD

            try {
                // Check attendance data for this date
                const attendanceRef = doc(db, "attendance", userId, "dates", dateKey);
                const attendanceSnap = await getDoc(attendanceRef);

                if (attendanceSnap.exists()) {
                    const attendanceData = attendanceSnap.data();
                    const clockInBranch = attendanceData.clockIn?.branch;

                    if (clockInBranch) {
                        const mappedBranch = mapBranchNameToValue(clockInBranch);
                        if (mappedBranch) {
                            // Auto-select the branch from attendance
                            document.getElementById("branchSelect").value = mappedBranch;
                            currentBranch = mappedBranch;
                            if (window.handleBranchChange) {
                                window.handleBranchChange();
                            }
                            
                            // Save to localStorage
                            localStorage.setItem(`lastSalesBranch_${userId}`, mappedBranch);
                            return;
                        }
                    }
                }

                // No attendance found, use last selected branch
                const lastBranch = localStorage.getItem(`lastSalesBranch_${userId}`) || "sm-north";
                document.getElementById("branchSelect").value = lastBranch;
                currentBranch = lastBranch;
                if (window.handleBranchChange) {
                    window.handleBranchChange();
                }
            } catch (error) {
                console.error("Error checking attendance:", error);
                // Fallback to last selected branch
                const lastBranch = localStorage.getItem(`lastSalesBranch_${userId}`) || "sm-north";
                document.getElementById("branchSelect").value = lastBranch;
                currentBranch = lastBranch;
                if (window.handleBranchChange) {
                    window.handleBranchChange();
                }
            }
        };

        // Function to check for existing data and show appropriate view
        window.checkExistingData = async function() {
            // Don't check if we're in editing mode
            if (window.isEditingMode) {
                return;
            }
            
            try {
                const selectedDate = flatpickrInstance?.selectedDates[0];
                if (!selectedDate) return;
                
                const recordDate = selectedDate.toLocaleDateString('en-CA');
                const branch = document.getElementById("branchSelect").value;
                
                // Check if record exists
                const salesRef = doc(db, "sales-data", branch, "daily", recordDate);
                const existingSnap = await getDoc(salesRef);
                
                if (existingSnap.exists()) {
                    // Data exists - show summary view, hide form
                    const existingData = existingSnap.data();
                    showSummaryView(existingData, branch, recordDate);
                } else {
                    // No data - show form, hide summary, and clear all form fields
                    clearFormFields();
                    showFormView();
                }
            } catch (error) {
                console.error("Error checking existing data:", error);
                // On error, show form view
                showFormView();
            }
        };

        // Function to show summary view
        function showSummaryView(data, branch, recordDate) {
            // Hide form section
            document.getElementById("formSection").style.display = "none";
            
            // Hide form fields (but keep date and branch visible)
            const totalDisplay = document.getElementById("totalDisplay");
            if (totalDisplay) {
                totalDisplay.style.display = "none";
                const totalLabel = totalDisplay.previousElementSibling;
                if (totalLabel && totalLabel.tagName === 'LABEL') {
                    totalLabel.style.display = "none";
                }
            }
            
            const walkInRow = document.getElementById("walkInSales")?.parentElement?.parentElement;
            if (walkInRow) {
                walkInRow.style.display = "none";
            }
            
            const paymentContainer = document.getElementById("paymentFieldsContainer");
            if (paymentContainer) {
                paymentContainer.style.display = "none";
            }
            
            const expensesContainer = document.getElementById("expensesContainer");
            if (expensesContainer) {
                expensesContainer.style.display = "none";
            }
            
            const cashReconciliationContainer = document.getElementById("cashReconciliationContainer");
            if (cashReconciliationContainer) {
                cashReconciliationContainer.style.display = "none";
            }
            
            // Show summary section
            document.getElementById("summarySection").style.display = "block";
            
            // Generate and display summary - use dateDisplay from data if available, otherwise format it
            let dateDisplay;
            if (data.dateDisplay) {
                dateDisplay = data.dateDisplay;
            } else {
                // Format the date string using the same format as the input field
                try {
                    const dateObj = new Date(recordDate + 'T00:00:00');
                    // Use the same format as formatDate function
                    dateDisplay = dateObj.toLocaleDateString("en-PH", {
                        weekday: 'long',
                        month: 'long',
                        day: 'numeric'
                    });
                } catch (e) {
                    dateDisplay = recordDate;
                }
            }
            // Pass recordDate for proper formatting
            const displaySummaryHTML = generateDisplaySummaryHTML(data, branch, dateDisplay, recordDate);
            document.getElementById("existingDataSummary").innerHTML = displaySummaryHTML;
            
            // Store data for download and edit
            window.existingData = data;
            window.existingBranch = branch;
            window.existingDate = recordDate;
            window.existingDateDisplay = dateDisplay;
            window.existingFullSummaryHTML = generateSummaryHTML(data, branch, dateDisplay);
        }

        // Function to clear all form fields
        function clearFormFields() {
            // Clear all input fields (except readonly ones like date)
            const inputIds = ['cash', 'card', 'gcash', 'maya', 'grab', 'expenses', 'actualCashLeft', 'qr', 'giftCard', 'nonCashExpenses'];
            inputIds.forEach(id => {
                const field = document.getElementById(id);
                if (field) {
                    field.value = '';
                    field.dataset.raw = '';
                }
            });
            
            // Reset totals
            updateTotal();
        }
        
        // Function to show form view
        function showFormView(isEditMode = false) {
            // Show form section
            document.getElementById("formSection").style.display = "block";
            
            // Show/hide cancel button based on edit mode
            const cancelBtn = document.getElementById("cancelEditBtn");
            if (cancelBtn) {
                cancelBtn.style.display = isEditMode ? "block" : "none";
            }
            
            // Show form fields
            const totalDisplay = document.getElementById("totalDisplay");
            if (totalDisplay) {
                totalDisplay.style.display = "block";
                const totalLabel = totalDisplay.previousElementSibling;
                if (totalLabel && totalLabel.tagName === 'LABEL') {
                    totalLabel.style.display = "block";
                }
            }
            
            const walkInRow = document.getElementById("walkInSales")?.parentElement?.parentElement;
            if (walkInRow) {
                walkInRow.style.display = "flex";
            }
            
            const paymentContainer = document.getElementById("paymentFieldsContainer");
            if (paymentContainer) {
                paymentContainer.style.display = "block";
            }
            
            const expensesContainer = document.getElementById("expensesContainer");
            if (expensesContainer) {
                expensesContainer.style.display = "block";
            }
            
            const cashReconciliationContainer = document.getElementById("cashReconciliationContainer");
            if (cashReconciliationContainer) {
                cashReconciliationContainer.style.display = "block";
            }
            
            // Hide summary section
            document.getElementById("summarySection").style.display = "none";
            
            // Clear existing data only if not in edit mode
            if (!isEditMode) {
                window.existingData = null;
                window.existingBranch = null;
                window.existingDate = null;
                window.existingDateDisplay = null;
                window.existingFullSummaryHTML = null;
            }
        }

        // Function to edit existing data
        window.editExistingData = function() {
            if (!window.existingData) {
                window.showToast("❌ No data to edit");
                return;
            }
            
            // Store existing data before showing form view
            const data = window.existingData;
            const branch = window.existingBranch;
            const recordDate = window.existingDate;
            
            // Set flag to prevent checkExistingData from interfering during edit
            window.isEditingMode = true;
            window.editModeRecordDate = recordDate; // Store the original date being edited
            
            // Ensure branch is set correctly
            if (branch) {
                document.getElementById("branchSelect").value = branch;
                currentBranch = branch;
            }
            
            // Show form view in edit mode (this shows the cancel button)
            showFormView(true);
            
            // Initialize fields for the correct branch (this will recreate them if needed)
            // This needs to happen after showFormView so the container is visible
            // Use setupBranchFields directly to avoid triggering the edit mode cancellation logic
            setupBranchFields(branch);
            
            // Reinitialize input listeners for new fields
            initializeInputListeners();
            
            // Populate fields after they're initialized
            // Use a delay to ensure fields are set up
            setTimeout(() => {
                populateFormFields(data, branch);
            }, 100);
        };
        
        // Function to check existing data for edit mode when date changes
        window.checkExistingDataForEdit = async function(selectedDate) {
            try {
                const recordDate = selectedDate.toLocaleDateString('en-CA');
                const branch = document.getElementById("branchSelect").value;
                const salesRef = doc(db, "sales-data", branch, "daily", recordDate);
                const existingSnap = await getDoc(salesRef);
                
                if (existingSnap.exists()) {

        function initializeInputListeners() {
            const inputIds = currentBranch === "sm-north" 
                ? ['cash', 'card', 'gcash', 'maya', 'grab', 'expenses', 'actualCashLeft']
                : ['cash', 'card', 'qr', 'giftCard', 'grab', 'expenses', 'nonCashExpenses', 'actualCashLeft'];
            
            inputIds.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;

                el.addEventListener('input', () => {
                    el.dataset.raw = el.value.replace(/[^0-9.]/g, '');
                });

                el.addEventListener('blur', () => {
                    const raw = el.dataset.raw || '0';
                    const parsed = parseFloat(raw.replace(/,/g, ''));
                    if (!isNaN(parsed)) {
                        el.value = parsed.toLocaleString('en-US', {
                            minimumFractionDigits: 0,
                            maximumFractionDigits: 2
                        });
                    } else {
                        el.value = '';
                    }
                    updateTotal();
                });

                el.addEventListener('focus', () => {
                    el.value = el.dataset.raw || '';
                });
            });
        }

        function updateTotal() {
            const inputIds = currentBranch === "sm-north" 
                ? ['cash', 'card', 'gcash', 'maya', 'grab']
                : ['cash', 'card', 'qr', 'giftCard', 'grab'];
            
            const formatCurrencyValue = (num) => {
                const absVal = Math.abs(num).toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
                return num < 0 ? `-₱${absVal}` : `₱${absVal}`;
            };

            const total = inputIds.reduce((sum, id) => {
                const el = document.getElementById(id);
                const raw = el ? (el.dataset.raw || '0') : '0';
                const val = parseFloat(raw) || 0;
                return sum + val;
            }, 0);

            const cashRaw = document.getElementById('cash')?.dataset.raw || '0';
            const cashVal = parseFloat(cashRaw) || 0;
            const expensesRaw = document.getElementById('expenses')?.dataset.raw || '0';
            const expensesVal = parseFloat(expensesRaw) || 0;
            const calculatedCashLeft = cashVal - expensesVal;

            const grabRaw = document.getElementById('grab')?.dataset.raw || '0';
            const grabVal = parseFloat(grabRaw) || 0;
            const walkInSales = total - grabVal;

            const actualCashRaw = document.getElementById('actualCashLeft')?.dataset.raw || '0';
            const actualCashVal = parseFloat(actualCashRaw) || 0;
            const variance = actualCashVal - calculatedCashLeft;

            const totalDisplay = document.getElementById("totalDisplay");
            const walkInDisplay = document.getElementById("walkInSales");
            const cashLeftDisplay = document.getElementById("cashLeft");
            const varianceDisplay = document.getElementById("varianceDisplay");

            if (totalDisplay) {
                totalDisplay.value = formatCurrencyValue(total);
            }
            if (walkInDisplay) {
                walkInDisplay.value = formatCurrencyValue(walkInSales);
            }
            if (cashLeftDisplay) {
                cashLeftDisplay.value = formatCurrencyValue(calculatedCashLeft);
            }
            if (varianceDisplay) {
                const formattedVariance = formatCurrencyValue(variance);
                const isVarianceZero = Math.abs(variance) < 0.0005;
                varianceDisplay.value = isVarianceZero ? '₱0.00' : formattedVariance;
                varianceDisplay.style.color = isVarianceZero ? '#333' : variance < 0 ? '#d9534f' : '#2b9348';
            }
        }

        function formatSummaryDate(dateDisplay) {
            let formattedDate = dateDisplay;
            try {
                // If it's in YYYY-MM-DD format (raw date), convert it
                if (dateDisplay && dateDisplay.match(/^\d{4}-\d{2}-\d{2}$/)) {
                    const dateObj = new Date(dateDisplay + 'T00:00:00');
                    formattedDate = dateObj.toLocaleDateString('en-US', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                } else if (dateDisplay && typeof dateDisplay === 'string' && dateDisplay.includes('-') && !dateDisplay.includes(',')) {
                    // Try to parse if it looks like a date string without formatting
                    const dateObj = new Date(dateDisplay);
                    if (!isNaN(dateObj.getTime())) {
                        formattedDate = dateObj.toLocaleDateString('en-US', {
                            weekday: 'long',
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        });
                    }
                }
                // Otherwise, use dateDisplay as-is (already formatted)
            } catch (e) {
                // Keep original if parsing fails
                formattedDate = dateDisplay;
            }
            return formattedDate;
        }
        
        // Function to format date for display (date on one line, weekday on next)
        function formatDateForDisplay(dateDisplay, recordDate) {
            let dateObj;
            try {
                // Try to parse from recordDate first (YYYY-MM-DD format)
                if (recordDate && recordDate.match(/^\d{4}-\d{2}-\d{2}$/)) {
                    dateObj = new Date(recordDate + 'T00:00:00');
                } else if (dateDisplay && dateDisplay.match(/^\d{4}-\d{2}-\d{2}$/)) {
                    dateObj = new Date(dateDisplay + 'T00:00:00');
                } else if (dateDisplay && typeof dateDisplay === 'string') {
                    // Try to parse existing formatted date
                    dateObj = new Date(dateDisplay);
                } else {
                    dateObj = new Date();
                }
                
                if (isNaN(dateObj.getTime())) {
                    // Fallback to current date
                    dateObj = new Date();
                }
                
                // Format date without weekday: "November 12, 2025"
                const dateStr = dateObj.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                // Format weekday: "Wednesday"
                const weekdayStr = dateObj.toLocaleDateString('en-US', {
                    weekday: 'long'
                });
                
                return {
                    date: dateStr,
                    weekday: weekdayStr
                };
            } catch (e) {
                // Fallback
                return {
                    date: dateDisplay || new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
                    weekday: new Date().toLocaleDateString('en-US', { weekday: 'long' })
                };
            }
        }

                let originalHTML = "";

                    downloadBtn.disabled = true;
                    downloadBtn.innerHTML = "Generating...";

                await new Promise(resolve => setTimeout(resolve, 100));

                // Get the modal content div (the white card) but exclude buttons
                const modalContentDiv = modal.querySelector('#successModalContent');

                    window.showToast("❌ Could not capture modal");

                        downloadBtn.disabled = false;
                        downloadBtn.innerHTML = downloadBtn.dataset.originalHtml || originalHTML || "Download";
                    }
                    return;

                            const prevData = existing.exists() ? existing.data() : {};

                            let updatedRecord;
                            if (branch === "sm-north") {
                                updatedRecord = {
                                ...prevData,
                                grab: grabNet,
                                totalSales: (prevData.totalSales || 0) - (prevData.grab || 0) + grabNet,
                                walkInSales: (prevData.cash || 0) + (prevData.card || 0) + (prevData.gcash || 0) + (prevData.maya || 0),
                                timestamp: serverTimestamp()
                            };
                            } else {
                                updatedRecord = {
                                    ...prevData,
                                    grab: grabNet,
                                    totalSales: (prevData.totalSales || 0) - (prevData.grab || 0) + grabNet,
                                    walkInSales: (prevData.cash || 0) + (prevData.card || 0) + (prevData.qr || 0) + (prevData.giftCard || 0),
                                    timestamp: serverTimestamp()
                                };
                            }

                            console.log("Updating Firestore with:", updatedRecord);

                            await setDoc(salesRef, updatedRecord, { merge: true });
                        } catch (err) {
                            console.error("❌ Error processing row:", row, err);
                        }
                    }

                    window.showToast("✅ Grab CSV upload complete!");
                }
            });
        });

    </script>

    <script>
        function getLocalISODateString(date) {
                const tzOffset = date.getTimezoneOffset() * 60000;
                return new Date(date - tzOffset).toISOString().slice(0, 10);
            }

        function formatDate(date) {
            return date.toLocaleDateString("en-PH", {
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            });
        }

            let flatpickrInstance;

        document.addEventListener("DOMContentLoaded", () => {
                const now = new Date();
                document.getElementById("recordDate").value = formatDate(now);
            document.getElementById("recordDate").dataset.iso = now.toISOString().slice(0, 10);

            flatpickr("#recordDate", {
                dateFormat: "Y-m-d",
                defaultDate: new Date(),
                allowInput: false,
                onChange: async function (selectedDates) {
                    document.getElementById("recordDate").value = formatDate(selectedDates[0]);
                    // Check attendance and update branch when date changes
                    if (window.checkAttendanceAndSetBranch) {
                        await window.checkAttendanceAndSetBranch();
                    }
                    
                    // If in edit mode, check if new date has data, if not clear form
                    if (window.isEditingMode) {
                        // Use checkExistingDataForEdit helper which is defined in the module
                        if (window.checkExistingDataForEdit) {
                            setTimeout(async () => {
                                await window.checkExistingDataForEdit(selectedDates[0]);
                            }, 100);
                        } else {
                            // Fallback: clear form if helper not available
                            if (window.clearFormFields) {
                                window.clearFormFields();
                            }
                            window.existingData = null;
                            window.existingBranch = null;
                            window.existingDate = null;
                        }
                    } else {
                        // Not in edit mode - check for existing data normally
                        if (window.checkExistingData) {
                            setTimeout(() => {
                                window.checkExistingData();
                            }, 300);
                        }
                    }
                },
                onReady: function (selectedDates, dateStr, instance) {
                    flatpickrInstance = instance;
                    // Check attendance and set branch on initial load
                    setTimeout(async () => {
                        if (window.checkAttendanceAndSetBranch) {
                            await window.checkAttendanceAndSetBranch();
                        } else {
                            // Fallback: just set default branch
                            const lastBranch = localStorage.getItem(`lastSalesBranch_${localStorage.getItem("loggedInUser") || ""}`) || "sm-north";
                            document.getElementById("branchSelect").value = lastBranch;
                            if (window.handleBranchChange) {
                                window.handleBranchChange();
                            }
                        }
                        // Check for existing data after initial setup (give time for fields to be set up)
                        if (window.checkExistingData) {
                            setTimeout(() => {
                                window.checkExistingData();
                            }, 600);
                        }
                    }, 200);
                }
                    });
                });
    </script>
