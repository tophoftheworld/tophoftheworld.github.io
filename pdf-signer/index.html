<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Signer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h1 class="app-title">PDF Signer</h1>

            <section class="sidebar-section">
                <h2 class="section-label">File</h2>
                <div class="btn-stack">
                    <button type="button" id="btnOpen" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        Open / Replace
                    </button>
                    <button type="button" id="btnDownload" class="btn btn-primary" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download Signed PDF
                    </button>
                    <button type="button" id="btnClear" class="btn btn-flat" disabled>Clear</button>
                </div>
                <p class="file-name" id="fileName" hidden></p>
            </section>

            <section class="sidebar-section">
                <h2 class="section-label">Tools</h2>
                <div class="tool-grid">
                    <button type="button" id="btnToolText" class="tool-btn" data-tool="text" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                        Text
                    </button>
                    <button type="button" id="btnToolCheck" class="tool-btn" data-tool="check" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                        Check
                    </button>
                    <button type="button" id="btnToolPen" class="tool-btn" data-tool="pen" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
                        Pen
                    </button>
                </div>
                <div class="tool-options" id="toolOptions" hidden>
                    <div class="tool-options-row">
                        <label class="tool-size-label" id="toolSizeLabel">Pen width</label>
                        <input type="range" id="toolSize" min="8" max="72" step="1" value="14">
                    </div>
                    <div class="text-size-preview" id="textSizePreview" hidden>
                        <div class="text-size-preview-page" id="textSizePreviewPage">
                            <span class="text-size-sample" id="textSizeSample">Sample</span>
                        </div>
                        <div class="text-size-meta">
                            <span class="text-size-pt" id="textSizePt">14 pt</span>
                            <span class="text-size-zoom" id="textSizeZoomNote">Matches page at current zoom</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="sidebar-section">
                <h2 class="section-label">Signatures</h2>
                <button type="button" id="btnNewSignature" class="btn btn-secondary btn-full">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    New Signature
                </button>
                <div class="signature-grid" id="signatureGrid">
                    <p class="empty-hint" id="signatureEmpty">No saved signatures yet</p>
                </div>
                <button type="button" id="btnDeleteSaved" class="btn btn-flat btn-danger btn-full" disabled>Delete Selected Saved</button>
            </section>
        </aside>

        <main class="workspace">
            <div class="dropzone" id="dropzone" role="button" tabindex="0">
                <div class="dropzone-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
                </div>
                <p class="dropzone-title">Drop a PDF or photo here</p>
                <p class="dropzone-sub">JPG, PNG, WebP — exports as PDF</p>
            </div>

            <div class="viewer" id="viewer" hidden>
                <div class="viewer-scroll" id="viewerScroll">
                    <div class="pages-container" id="pagesContainer"></div>
                </div>
                <div class="viewer-bar">
                    <div class="page-nav">
                        <button type="button" id="btnPrevPage" class="btn-icon" title="Previous page" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>
                        <span id="pageIndicator">1 / 1</span>
                        <button type="button" id="btnNextPage" class="btn-icon" title="Next page" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                    </div>
                    <div class="zoom-nav">
                        <button type="button" class="btn-zoom" data-zoom="fit">Fit</button>
                        <button type="button" class="btn-zoom" data-zoom="0.75">75%</button>
                        <button type="button" class="btn-zoom active" data-zoom="1">100%</button>
                        <button type="button" class="btn-zoom" data-zoom="1.25">125%</button>
                    </div>
                </div>
            </div>

            <div class="placement-ghost" id="placementGhost" hidden>
                <img id="placementGhostImg" alt="">
            </div>
        </main>
    </div>

    <input type="file" id="pdfInput" accept="application/pdf,.pdf,image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif" hidden>
    <input type="file" id="imageInput" accept="image/png,image/jpeg,image/jpg" hidden>

    <!-- Signature modal -->
    <div class="modal-backdrop" id="signatureModal" hidden>
        <div class="modal" role="dialog" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h2 id="modalTitle">New Signature</h2>
                <button type="button" class="btn-icon modal-close" id="modalClose" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-tabs">
                <button type="button" class="tab active" data-tab="draw">Draw</button>
                <button type="button" class="tab" data-tab="upload">Upload</button>
            </div>
            <div class="modal-body">
                <div class="tab-panel active" id="tabDraw">
                    <canvas id="drawCanvas" width="460" height="180"></canvas>
                    <p class="canvas-hint">Sign with mouse or trackpad</p>
                </div>
                <div class="tab-panel" id="tabUpload" hidden>
                    <div class="upload-zone" id="uploadZone">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        <p>Drop PNG or JPG</p>
                        <p class="upload-sub">or click to browse</p>
                    </div>
                    <img id="uploadPreview" class="upload-preview" alt="Upload preview" hidden>
                </div>
            </div>
            <div class="modal-footer">
                <input type="text" id="signatureName" class="input-name" placeholder="Signature name (optional)">
                <div class="modal-actions">
                    <button type="button" id="btnClearCanvas" class="btn btn-flat">Clear</button>
                    <button type="button" id="btnSaveSignature" class="btn btn-primary">Save Signature</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Transform toolbar -->
    <div class="transform-toolbar" id="transformToolbar" hidden>
        <button type="button" class="toolbar-btn toolbar-delete" id="btnDeletePlaced" title="Delete">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Delete
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.2.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
