<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Matchanese Schedule</title>
    <link rel="icon" href="icons/icon-64.png" type="image/png">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://matchanese.site/scheduling/">
    <meta property="og:title" content="Matchanese Scheduling">
    <meta property="og:description" content="Matchanese Employee Scheduling System">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=43">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>
    <!-- Shift Modal -->
    <div class="modal" id="shiftModal">
        <div class="modal-content">
            <span class="close-modal" id="closeShiftModal">&times;</span>
            <h2 id="modalTitle">Add Shift</h2>
            <form id="shiftForm">
                <div class="form-group">
                    <label for="shiftDate">Date</label>
                    <input type="date" id="shiftDate" required>
                </div>
                <div class="form-group">
                    <label for="shiftBranch">Location</label>
                    <select id="shiftBranch" required>
                        <option value="">Select location</option>
                        <option value="podium">Podium</option>
                        <option value="smnorth">SM North</option>
                        <option value="popup">Pop-up</option>
                        <option value="workshop">Workshop</option>
                        <option value="other">Other Events</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="shiftType">Shift Type</label>
                    <select id="shiftType" required>
                        <option value="">Select shift type</option>
                        <option value="opening">Opening (9:30 AM - 6:30 PM)</option>
                        <option value="midshift">Midshift (11:00 AM - 8:00 PM)</option>
                        <option value="closing">Closing (1:00 PM - 10:00 PM)</option>
                        <option value="closingHalf">Closing Half Day (6:00 PM - 10:00 PM)</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="form-group" id="customTimeGroup" style="display: none;">
                    <label for="customStartTime">Start Time</label>
                    <input type="time" id="customStartTime">
                    <label for="customEndTime">End Time</label>
                    <input type="time" id="customEndTime">
                </div>
                <div class="form-group">
                    <label for="shiftEmployee">Employee</label>
                    <select id="shiftEmployee">
                        <option value="">Select employee</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="shiftRole">Role</label>
                    <select id="shiftRole">
                        <option value="barista">Barista</option>
                        <option value="deliveries">Deliveries</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="form-group" id="customRoleGroup" style="display: none;">
                    <label for="shiftRoleCustom">Custom role name</label>
                    <input type="text" id="shiftRoleCustom" placeholder="e.g. Lead, Trainee">
                </div>
                <input type="hidden" id="shiftId">
                <input type="hidden" id="originalDate">
                <input type="hidden" id="originalBranch">
                <div class="form-actions">
                    <button type="submit" class="submit-btn">Save Shift</button>
                    <button type="button" class="cancel-btn" id="cancelShiftBtn">Cancel</button>
                    <button type="button" class="danger-btn" id="deleteShiftBtn" style="display: none;">Delete Shift</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Location Modal -->
    <div class="modal" id="addBranchModal">
        <div class="modal-content modal-content--branch">
            <span class="close-modal" id="closeBranchModal">&times;</span>
            <h2 id="branchModalTitle">Add New Location</h2>
            <form id="branchForm">
                <div class="form-group">
                    <label for="branchName">Location Name</label>
                    <input type="text" id="branchName" required placeholder="Enter location name">
                </div>
                <div class="form-group">
                    <label for="branchType">Location Type</label>
                    <select id="branchType" required>
                        <option value="">Select type</option>
                        <option value="popup">Pop-up</option>
                        <option value="workshop">Workshop</option>
                    </select>
                </div>
                <input type="hidden" id="branchKey">
                <div class="form-actions">
                    <button type="submit" class="submit-btn" id="branchSubmitBtn">Add Location</button>
                    <button type="button" class="cancel-btn" id="cancelBranchBtn">Cancel</button>
                </div>
            </form>
            <div class="branch-list-section" id="branchListSection">
                <h3 class="branch-list-title" id="branchListTitle">Existing pop-ups</h3>
                <ul class="branch-list" id="branchList"></ul>
            </div>
        </div>
    </div>

    <!-- Shift details modal (My Schedule card tap) -->
    <div class="modal" id="shiftDetailsModal">
        <div class="modal-content shift-details-modal__content" onclick="event.stopPropagation()">
            <span class="close-modal" id="closeShiftDetailsModal" aria-label="Close">&times;</span>
            <h2 class="shift-details-modal__title">Shift details</h2>
            <div class="shift-details-modal__body">
                <p class="shift-details-modal__row"><span class="shift-details-modal__label">Date</span><span id="shiftDetailsDate"></span></p>
                <p class="shift-details-modal__row"><span class="shift-details-modal__label">Branch</span><span id="shiftDetailsBranch"></span></p>
                <p class="shift-details-modal__row"><span class="shift-details-modal__label">Shift type</span><span id="shiftDetailsShiftType"></span></p>
                <p class="shift-details-modal__row shift-details-modal__time" id="shiftDetailsTimeRow"><span class="shift-details-modal__label">Time</span><span id="shiftDetailsTime"></span></p>
                <p class="shift-details-modal__row shift-details-modal__actual-time" id="shiftDetailsActualTimeRow" style="display: none;"><span class="shift-details-modal__label">Actual</span><span id="shiftDetailsActualTime"></span></p>
            </div>
            <div class="shift-details-modal__actions" id="shiftDetailsActions">
                <div class="shift-details-reliever-form" id="shiftDetailsRelieverForm" style="display: none;">
                    <label for="shiftDetailsRelieverSelect" class="shift-details-modal__label">Select reliever</label>
                    <select id="shiftDetailsRelieverSelect">
                        <option value="">Select reliever</option>
                    </select>
                    <button type="button" class="submit-btn" id="shiftDetailsSubmitRequestBtn"><span class="btn-spinner"></span><span class="btn-text">Submit request</span></button>
                </div>
                <p class="shift-details-pending-msg" id="shiftDetailsPendingMsg" style="display: none;">Reliever request pending</p>
                <button type="button" class="submit-btn" id="shiftDetailsRequestSubstitutionBtn" style="display: none;">Request Reliever</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="admin-header">
            <div class="header-content">
                <h1 class="app-title">Schedule Dashboard</h1>
                
                <div class="controls">
                    <div class="control-group">
                        <label class="control-label">Location Filter</label>
                        <select id="branchFilter">
                            <option value="all">All Locations</option>
                            <option value="podium">Podium</option>
                            <option value="smnorth">SM North</option>
                            <option value="popup">Pop-up</option>
                            <option value="workshop">Workshop</option>
                            <option value="other">Other Events</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">View Mode</label>
                        <div class="toggle-container">
                            <input type="radio" name="viewMode" value="shift" id="shiftView" checked>
                            <label for="shiftView">Shift</label>
                            <input type="radio" name="viewMode" value="calendar" id="calendarView">
                            <label for="calendarView">Calendar</label>
                            <input type="radio" name="viewMode" value="employee" id="employeeView">
                            <label for="employeeView">Employee</label>
                        </div>
                    </div>
                    
                    <div class="control-group horizontal">
                        <button class="refresh-btn" id="syncBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 2v6h-6"></path>
                                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                                <path d="M3 22v-6h6"></path>
                                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                            </svg>
                            Sync
                        </button>
                        <button class="danger-btn" id="deleteFutureBtn" style="background-color: #dc3545;">
                            💀 Delete All
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Multi-select Controls -->
        <div class="multi-select-controls hidden" id="multiSelectControls">
            <span class="selection-counter" id="selectionCounter">0 selected</span>
            <button class="delete-selected-btn" id="deleteSelectedBtn" disabled>Delete</button>
            <button id="copySelectedBtn" disabled>Copy to Next Day</button>
            <button class="exit-selection-btn" id="exitSelectionBtn">Cancel</button>
        </div>
        

        <!-- Calendar View -->
        <div id="calendarViewContainer" class="view-container" style="display: none;">
            <div class="schedule-grid-container">
                <div class="schedule-grid" id="scheduleGrid">
                    <!-- Grid will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Shift View -->
        <div id="shiftViewContainer" class="view-container">
            <!-- Week Navigation integrated with calendar -->
            <div class="week-navigation">
                <button class="nav-btn icon-only" id="prevWeekBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M16 6 Q16 4 14 4 L8 10 Q6 12 8 14 L14 20 Q16 20 16 18 L16 6 Z" fill="currentColor"/>
                    </svg>
                </button>
                <h2 class="week-title" id="weekTitle">Loading...</h2>
                <button class="nav-btn icon-only" id="nextWeekBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 6 Q8 4 10 4 L16 10 Q18 12 16 14 L10 20 Q8 20 8 18 L8 6 Z" fill="currentColor"/>
                    </svg>
                </button>
                <button class="nav-btn copy-week-btn" id="copyPreviousWeekBtn" style="display: flex;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    Copy Previous Week
                </button>
            </div>
            <div class="shift-schedule-container">
                <div class="shift-schedule-grid" id="shiftScheduleGrid">
                    <!-- Grid will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Mobile Daily View -->
        <div id="mobileDailyView" class="mobile-daily-view" style="display: none;">

            <!-- Sticky calendar header -->
            <div class="mobile-cal-header">

                <!-- Month title — tap to expand/collapse full calendar -->
                <div class="mobile-month-row" id="mobileMonthRow">
                    <span id="mobileMonthTitle"></span>
                    <span class="mobile-cal-chevron" id="mobileCalChevron">▼</span>
                </div>

                <!-- Full month calendar (hidden by default) -->
                <div class="mobile-full-calendar" id="mobileFullCalendar">
                    <div class="mobile-cal-grid" id="mobileCalGrid"></div>
                </div>

                <!-- Week strip (always visible) -->
                <div class="mobile-week-strip" id="mobileWeekStrip"></div>

                <!-- Mode toggle + branch selector (Branch) / debug employee selector (My Schedule) -->
                <div class="mobile-controls-bar">
                    <div class="mobile-mode-toggle">
                        <button id="mobileBranchViewBtn" class="mobile-toggle-btn active">Branch</button>
                        <button id="mobileMyScheduleBtn" class="mobile-toggle-btn">My Schedule</button>
                    </div>
                    <select id="mobileBranchSelect" class="mobile-branch-select"></select>
                    <span id="mobileEmployeeSelectLabel" class="mobile-control-label" style="display:none">Employee:</span>
                    <select id="mobileEmployeeSelect" class="mobile-branch-select mobile-employee-select" style="display:none" title="Debug: pick employee"></select>
                </div>

            </div>

            <!-- Scrollable schedule content -->
            <div id="mobileScheduleContent" class="mobile-schedule-content"></div>

        </div>

        <!-- Employee View -->
        <div id="employeeViewContainer" class="view-container" style="display: none;">
            <div class="employee-schedule" id="employeeSchedule">
                <!-- Employee schedule will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <div id="scheduleToast" class="schedule-toast" aria-live="polite"></div>
    <script type="module" src="js/script.js?v=42"></script>
</body>

</html>
