<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manila Matcha Fest 2026</title>
    <meta name="robots" content="noindex,nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Manila Matcha Fest 2026">
    <meta property="og:description" content="Returning to SM Mall of Asia Main Atrium, August 7–16, 2026 — 24 matcha brands under one roof.">
    <meta property="og:url" content="https://mmf-pr.web.app/">
    <meta property="og:image" content="https://mmf-pr.web.app/images/og-cover.png">
    <meta property="og:image:alt" content="Manila Matcha Fest — August 7–16 at SM Mall of Asia">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Manila Matcha Fest 2026">
    <meta name="twitter:description" content="Returning to SM Mall of Asia Main Atrium, August 7–16, 2026 — 24 matcha brands under one roof.">
    <meta name="twitter:image" content="https://mmf-pr.web.app/images/og-cover.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pr-body">
    <div class="pr-app" id="prApp">
        <header class="pr-header">
            <div class="pr-header-inner">
                <h1 class="pr-logo-wrap">
                    <img class="pr-logo" src="images/mmf-logo.png" alt="Manila Matcha Fest 2026 — August 7–16 at SM Mall of Asia" width="320" height="320">
                </h1>
                <div class="pr-header-copy">
                    <div class="pr-intro-wrap" id="prIntroWrap">
                        <p class="pr-intro" id="prIntro"></p>
                    </div>
                    <a class="pr-logo-download" href="https://drive.google.com/file/d/1k32RjoF7o__LLqKoXT4mUwj8n0-5k4pa/view?usp=sharing" target="_blank" rel="noopener noreferrer">Download MMF Logos</a>
                </div>
            </div>
        </header>

        <div class="pr-main">
            <div class="pr-layout">
                <div class="pr-panel pr-list-panel">
                    <div class="pr-panel-header">
                        <span>Brands</span>
                        <input type="search" class="pr-search" id="prSearch" placeholder="Search brands…" aria-label="Search brands">
                    </div>
                    <div class="pr-list" id="prList">
                        <div class="pr-loading">Loading brands…</div>
                    </div>
                </div>

                <div class="pr-detail-backdrop" id="prDetailBackdrop" hidden></div>
                <div class="pr-panel pr-detail-panel" id="prDetailPanel" role="dialog" aria-modal="false" aria-labelledby="prDetailTitle">
                    <div class="pr-panel-header pr-panel-header--detail">
                        <button type="button" class="pr-back" id="prDetailClose" aria-label="Back to list">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
                            <span>Back to list</span>
                        </button>
                        <div class="pr-detail-heading">
                            <span id="prDetailTitle">Detail</span>
                        </div>
                    </div>
                    <div class="pr-detail empty" id="prDetail">Select a brand to view PR details.</div>
                </div>
            </div>
        </div>
    </div>

    <div class="pr-file-modal hidden" id="prFileModal" role="dialog" aria-modal="true" aria-labelledby="prFileModalTitle" hidden>
        <div class="pr-file-modal-backdrop" id="prFileModalBackdrop"></div>
        <div class="pr-file-modal-card">
            <div class="pr-file-modal-header">
                <h2 id="prFileModalTitle">Preview</h2>
                <button type="button" class="pr-file-modal-close" id="prFileModalClose" aria-label="Close preview">×</button>
            </div>
            <div class="pr-file-modal-body" id="prFileModalBody"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
