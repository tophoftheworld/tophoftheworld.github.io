<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matcha Pricing Calculator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Simple SVG Icons -->
    <script>
        // Simple icon components
        const Copy = ({ className }) => React.createElement('svg', {
            className,
            width: 16,
            height: 16,
            viewBox: '0 0 24 24',
            fill: 'none',
            stroke: 'currentColor',
            strokeWidth: 2,
            strokeLinecap: 'round',
            strokeLinejoin: 'round'
        }, 
            React.createElement('rect', { width: 14, height: 14, x: 8, y: 8, rx: 2, ry: 2 }),
            React.createElement('path', { d: 'M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2' })
        );
        
        const Settings2 = ({ className }) => React.createElement('svg', {
            className,
            width: 16,
            height: 16,
            viewBox: '0 0 24 24',
            fill: 'none',
            stroke: 'currentColor',
            strokeWidth: 2,
            strokeLinecap: 'round',
            strokeLinejoin: 'round'
        },
            React.createElement('path', { d: 'M20 7h-9' }),
            React.createElement('path', { d: 'M14 17H5' }),
            React.createElement('circle', { cx: 17, cy: 17, r: 3 }),
            React.createElement('circle', { cx: 7, cy: 7, r: 3 })
        );
        
        const ChevronDown = ({ className }) => React.createElement('svg', {
            className,
            width: 16,
            height: 16,
            viewBox: '0 0 24 24',
            fill: 'none',
            stroke: 'currentColor',
            strokeWidth: 2,
            strokeLinecap: 'round',
            strokeLinejoin: 'round'
        },
            React.createElement('path', { d: 'm6 9 6 6 6-6' })
        );
        
        const ChevronRight = ({ className }) => React.createElement('svg', {
            className,
            width: 16,
            height: 16,
            viewBox: '0 0 24 24',
            fill: 'none',
            stroke: 'currentColor',
            strokeWidth: 2,
            strokeLinecap: 'round',
            strokeLinejoin: 'round'
        },
            React.createElement('path', { d: 'm9 18 6-6-6-6' })
        );
    </script>
    
    <style>
        /* Custom styles for shadcn/ui-like components */
        .card {
            @apply rounded-lg border bg-card text-card-foreground shadow-sm;
        }
        
        .card-content {
            @apply p-6 pt-0;
        }
        
        .input {
            @apply flex h-10 w-full rounded-md border-2 border-blue-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:cursor-not-allowed disabled:opacity-50 disabled:bg-gray-100 disabled:border-gray-200;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.1);
        }
        
        .input:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.2);
        }
        
        .label {
            @apply text-sm font-medium text-gray-700 mb-1 block;
        }
        
        .editable-label {
            @apply text-sm font-medium text-blue-700 mb-1 block;
            position: relative;
        }
        
        .editable-label::before {
            content: "✏️";
            margin-right: 4px;
        }
        
        .readonly-label {
            @apply text-sm font-medium text-gray-500 mb-1 block;
            position: relative;
        }
        
        .readonly-label::before {
            content: "🔒";
            margin-right: 4px;
        }
        
        .button {
            @apply inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50;
        }
        
        .button-default {
            @apply bg-blue-600 text-white hover:bg-blue-700 h-10 px-4 py-2;
        }
        
        .button-outline {
            @apply border border-gray-300 bg-white hover:bg-gray-50 text-gray-700 h-10 px-4 py-2;
        }
        
        .select {
            @apply relative;
        }
        
        .select-trigger {
            @apply flex h-10 w-full items-center justify-between rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:cursor-not-allowed disabled:opacity-50;
        }
        
        .select-content {
            @apply relative z-50 max-h-96 min-w-[8rem] overflow-hidden rounded-md border border-gray-300 bg-white shadow-lg;
        }
        
        .select-item {
            @apply relative flex w-full cursor-pointer select-none items-center rounded-sm py-2 pl-3 pr-2 text-sm text-gray-900 hover:bg-gray-100 data-[disabled]:pointer-events-none data-[disabled]:opacity-50;
        }
        
        .select-item[data-state="checked"]::before {
            content: "✓";
            position: absolute;
            left: 0.75rem;
            color: #3b82f6;
            font-weight: bold;
        }
        
        .bg-muted\/30 {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
        }
        
        .readonly-field {
            @apply flex h-10 w-full rounded-md border-2 border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-600;
            position: relative;
        }
        
        .readonly-field::after {
            content: "READ ONLY";
            position: absolute;
            top: -8px;
            right: 8px;
            background: #6b7280;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        
        /* Hide select dropdown by default */
        .select-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 50;
        }
        
        .select.open .select-content {
            display: block;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Simple Select component implementation
        function Select({ value, onValueChange, children }) {
            const [isOpen, setIsOpen] = useState(false);
            
            const trigger = children.find(child => child.type.name === 'SelectTrigger');
            const content = children.find(child => child.type.name === 'SelectContent');
            
            return (
                <div className={`select ${isOpen ? 'open' : ''}`}>
                    <div 
                        className="select-trigger" 
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        {trigger.props.children}
                    </div>
                    {content && (
                        <div className="select-content">
                            {content.props.children.map((item, index) => (
                                <div 
                                    key={index}
                                    className="select-item"
                                    onClick={() => {
                                        onValueChange(item.props.value);
                                        setIsOpen(false);
                                    }}
                                >
                                    {item.props.children}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function SelectTrigger({ children }) {
            return <span>{children}</span>;
        }

        function SelectContent({ children }) {
            return <div>{children}</div>;
        }

        function SelectItem({ value, children }) {
            return <div value={value}>{children}</div>;
        }

        function SelectValue({ placeholder }) {
            return <span>{placeholder}</span>;
        }

        // Simple Card components
        function Card({ children }) {
            return <div className="card">{children}</div>;
        }

        function CardContent({ children, className = "" }) {
            return <div className={`card-content ${className}`}>{children}</div>;
        }

        // Simple Input component
        function Input({ className = "", ...props }) {
            return <input className={`input ${className}`} {...props} />;
        }

        // Simple Label component
        function Label({ children, className = "", ...props }) {
            return <label className={`label ${className}`} {...props}>{children}</label>;
        }

        // Simple Button component
        function Button({ variant = "default", className = "", children, ...props }) {
            const variantClass = variant === "outline" ? "button-outline" : "button-default";
            return (
                <button className={`button ${variantClass} ${className}`} {...props}>
                    {children}
                </button>
            );
        }

        // Helpers
        const peso = (n) => `₱${n.toLocaleString("en-PH", { maximumFractionDigits: 0 })}`;
        const roundTo = (n, step) => Math.round(n / step) * step;

        function MatchaPricingCalculator() {
            // Helper functions for localStorage
            const saveToStorage = (key, value) => {
                try {
                    localStorage.setItem(`matcha-calc-${key}`, JSON.stringify(value));
                } catch (e) {
                    console.warn('Could not save to localStorage:', e);
                }
            };

            const loadFromStorage = (key, defaultValue) => {
                try {
                    const stored = localStorage.getItem(`matcha-calc-${key}`);
                    return stored ? JSON.parse(stored) : defaultValue;
                } catch (e) {
                    console.warn('Could not load from localStorage:', e);
                    return defaultValue;
                }
            };

            // ===== 1) BASE SETTINGS (hideable) =====
            const [showBase, setShowBase] = useState(loadFromStorage('showBase', false));

            // Portion grams
            const [gHotUsucha, setGHotUsucha] = useState(loadFromStorage('gHotUsucha', 2));
            const [gIcedUsucha, setGIcedUsucha] = useState(loadFromStorage('gIcedUsucha', 2));
            const [gIcedLatteClassic, setGIcedLatteClassic] = useState(loadFromStorage('gIcedLatteClassic', 4));
            const [gIcedLatteCold, setGIcedLatteCold] = useState(loadFromStorage('gIcedLatteCold', 4));

            // Overheads
            const [ohHotUsucha, setOhHotUsucha] = useState(loadFromStorage('ohHotUsucha', 90));
            const [ohIcedUsucha, setOhIcedUsucha] = useState(loadFromStorage('ohIcedUsucha', 90));
            const [ohIcedLatteClassic, setOhIcedLatteClassic] = useState(loadFromStorage('ohIcedLatteClassic', 150));
            const [ohIcedLatteCold, setOhIcedLatteCold] = useState(loadFromStorage('ohIcedLatteCold', 150));

            // Rounding
            const [rounding, setRounding] = useState(loadFromStorage('rounding', "5"));

            // ===== 2) PER-MATCHA INPUT =====
            const [packPrice, setPackPrice] = useState(loadFromStorage('packPrice', 3000));
            const [packSizeG, setPackSizeG] = useState(loadFromStorage('packSizeG', 100));
            const [manualCostPerGEnabled, setManualCostPerGEnabled] = useState(loadFromStorage('manualCostPerGEnabled', false));
            const [manualCostPerG, setManualCostPerG] = useState(loadFromStorage('manualCostPerG', 0));

            // Wrapper functions that save to localStorage
            const updateShowBase = (value) => {
                setShowBase(value);
                saveToStorage('showBase', value);
            };

            const updateGHotUsucha = (value) => {
                setGHotUsucha(value);
                saveToStorage('gHotUsucha', value);
            };

            const updateGIcedUsucha = (value) => {
                setGIcedUsucha(value);
                saveToStorage('gIcedUsucha', value);
            };

            const updateGIcedLatteClassic = (value) => {
                setGIcedLatteClassic(value);
                saveToStorage('gIcedLatteClassic', value);
            };

            const updateGIcedLatteCold = (value) => {
                setGIcedLatteCold(value);
                saveToStorage('gIcedLatteCold', value);
            };

            const updateOhHotUsucha = (value) => {
                setOhHotUsucha(value);
                saveToStorage('ohHotUsucha', value);
            };

            const updateOhIcedUsucha = (value) => {
                setOhIcedUsucha(value);
                saveToStorage('ohIcedUsucha', value);
            };

            const updateOhIcedLatteClassic = (value) => {
                setOhIcedLatteClassic(value);
                saveToStorage('ohIcedLatteClassic', value);
            };

            const updateOhIcedLatteCold = (value) => {
                setOhIcedLatteCold(value);
                saveToStorage('ohIcedLatteCold', value);
            };

            const updateRounding = (value) => {
                setRounding(value);
                saveToStorage('rounding', value);
            };

            const updatePackPrice = (value) => {
                setPackPrice(value);
                saveToStorage('packPrice', value);
            };

            const updatePackSizeG = (value) => {
                setPackSizeG(value);
                saveToStorage('packSizeG', value);
            };

            const updateManualCostPerGEnabled = (value) => {
                setManualCostPerGEnabled(value);
                saveToStorage('manualCostPerGEnabled', value);
            };

            const updateManualCostPerG = (value) => {
                setManualCostPerG(value);
                saveToStorage('manualCostPerG', value);
            };

            const autoCostPerG = useMemo(() => (packSizeG > 0 ? packPrice / packSizeG : 0), [packPrice, packSizeG]);
            const costPerG = manualCostPerGEnabled ? manualCostPerG : autoCostPerG;

            // Rows to compute
            const rows = [
                { key: "hot-usucha", label: "Hot Usucha", grams: gHotUsucha, overhead: ohHotUsucha },
                { key: "iced-usucha", label: "Iced Usucha", grams: gIcedUsucha, overhead: ohIcedUsucha },
                { key: "iced-latte-classic", label: "Iced Latte • Classic", grams: gIcedLatteClassic, overhead: ohIcedLatteClassic },
                { key: "iced-latte-cold", label: "Iced Latte • Cold-whisked", grams: gIcedLatteCold, overhead: ohIcedLatteCold },
            ];

            const computed = rows.map(r => {
                const matchaCost = r.grams * (isFinite(costPerG) ? costPerG : 0);
                const srpExact = r.overhead + matchaCost;
                const step = rounding === "none" ? 1 : Number(rounding);
                const srpRounded = rounding === "none" ? Math.round(srpExact) : roundTo(srpExact, step);
                return { ...r, matchaCost, srpExact, srpRounded };
            });

            const copy = async (text) => { 
                try { 
                    await navigator.clipboard.writeText(text); 
                } catch {} 
            };

            return (
                <div className="min-h-screen bg-white text-gray-900 p-6 md:p-8">
                    <div className="max-w-5xl mx-auto space-y-6">
                        <div className="flex items-center justify-between">
                            <h1 className="text-2xl md:text-3xl font-semibold tracking-tight">Matcha Pricing Calculator</h1>
                            <Button variant="outline" className="gap-2" onClick={()=>updateShowBase(!showBase)}>
                                <Settings2 className="w-4 h-4" /> Base settings {showBase ? <ChevronDown className="w-4 h-4"/> : <ChevronRight className="w-4 h-4"/>}
                            </Button>
                        </div>

                        {/* BASE SETTINGS (collapsible) */}
                        {showBase && (
                            <Card>
                                <CardContent className="p-6 space-y-8">
                                    <h2 className="text-lg font-semibold text-gray-900">Base Settings</h2>
                                    
                                    {/* Portions */}
                                    <div>
                                        <h3 className="text-md font-medium text-gray-800 mb-4">Portion Sizes (grams)</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                            <div>
                                                <label className="editable-label">Hot Usucha</label>
                                                <Input type="number" value={gHotUsucha} onChange={e=>updateGHotUsucha(Number(e.target.value))} min={0} step={0.1} placeholder="2.0" />
                                            </div>
                                            <div>
                                                <label className="editable-label">Iced Usucha</label>
                                                <Input type="number" value={gIcedUsucha} onChange={e=>updateGIcedUsucha(Number(e.target.value))} min={0} step={0.1} placeholder="2.0" />
                                            </div>
                                            <div>
                                                <label className="editable-label">Iced Latte • Classic</label>
                                                <Input type="number" value={gIcedLatteClassic} onChange={e=>updateGIcedLatteClassic(Number(e.target.value))} min={0} step={0.1} placeholder="4.0" />
                                            </div>
                                            <div>
                                                <label className="editable-label">Iced Latte • Cold-whisked</label>
                                                <Input type="number" value={gIcedLatteCold} onChange={e=>updateGIcedLatteCold(Number(e.target.value))} min={0} step={0.1} placeholder="4.0" />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Overheads */}
                                    <div>
                                        <h3 className="text-md font-medium text-gray-800 mb-4">Overhead Costs (₱)</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                            <div>
                                                <label className="editable-label">Hot Usucha</label>
                                                <Input type="number" value={ohHotUsucha} onChange={e=>updateOhHotUsucha(Number(e.target.value))} min={0} placeholder="90" />
                                            </div>
                                            <div>
                                                <label className="editable-label">Iced Usucha</label>
                                                <Input type="number" value={ohIcedUsucha} onChange={e=>updateOhIcedUsucha(Number(e.target.value))} min={0} placeholder="90" />
                                            </div>
                                            <div>
                                                <label className="editable-label">Iced Latte • Classic</label>
                                                <Input type="number" value={ohIcedLatteClassic} onChange={e=>updateOhIcedLatteClassic(Number(e.target.value))} min={0} placeholder="150" />
                                            </div>
                                            <div>
                                                <label className="editable-label">Iced Latte • Cold-whisked</label>
                                                <Input type="number" value={ohIcedLatteCold} onChange={e=>updateOhIcedLatteCold(Number(e.target.value))} min={0} placeholder="150" />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Rounding */}
                                    <div>
                                        <h3 className="text-md font-medium text-gray-800 mb-4">Price Rounding</h3>
                                        <div className="max-w-xs">
                                            <label className="editable-label">Rounding Method</label>
                                            <Select value={rounding} onValueChange={updateRounding}>
                                                <SelectTrigger>
                                                    <SelectValue placeholder="Choose rounding" />
                                                </SelectTrigger>
                                                <SelectContent>
                                                    <SelectItem value="none">No rounding</SelectItem>
                                                    <SelectItem value="1">Nearest 1</SelectItem>
                                                    <SelectItem value="5">Nearest 5</SelectItem>
                                                    <SelectItem value="10">Nearest 10</SelectItem>
                                                </SelectContent>
                                            </Select>
                                        </div>
                                    </div>
                                </CardContent>
                            </Card>
                        )}

                        {/* PER-MATCHA INPUT (fast) */}
                        <Card>
                            <CardContent className="p-6">
                                <h2 className="text-lg font-semibold text-gray-900 mb-4">Matcha Cost Calculator</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                    <div>
                                        <label className={manualCostPerGEnabled ? "readonly-label" : "editable-label"}>Pack Price (₱)</label>
                                        <Input 
                                            type="number" 
                                            value={packPrice} 
                                            onChange={e=>updatePackPrice(Number(e.target.value))} 
                                            min={0} 
                                            disabled={manualCostPerGEnabled}
                                            placeholder="Enter pack price"
                                        />
                                        {manualCostPerGEnabled && <p className="text-xs text-gray-500 mt-1">Disabled when manual cost is enabled</p>}
                                    </div>
                                    <div>
                                        <label className={manualCostPerGEnabled ? "readonly-label" : "editable-label"}>Pack Size (g)</label>
                                        <Input 
                                            type="number" 
                                            value={packSizeG} 
                                            onChange={e=>updatePackSizeG(Number(e.target.value))} 
                                            min={1} 
                                            disabled={manualCostPerGEnabled}
                                            placeholder="Enter pack size"
                                        />
                                        {manualCostPerGEnabled && <p className="text-xs text-gray-500 mt-1">Disabled when manual cost is enabled</p>}
                                    </div>
                                    <div>
                                        <label className="readonly-label">Auto Cost per Gram</label>
                                        <div className="readonly-field">
                                            {isFinite(autoCostPerG) ? `₱${autoCostPerG.toFixed(2)}` : "—"}
                                        </div>
                                        <p className="text-xs text-gray-500 mt-1">Calculated automatically</p>
                                    </div>
                                    <div>
                                        <label className={manualCostPerGEnabled ? "editable-label" : "readonly-label"}>Manual Cost per Gram</label>
                                        <Input 
                                            type="number" 
                                            value={manualCostPerG} 
                                            onChange={e=>updateManualCostPerG(Number(e.target.value))} 
                                            min={0} 
                                            disabled={!manualCostPerGEnabled}
                                            placeholder="Enter manual cost"
                                        />
                                        <div className="mt-2 flex items-center gap-2">
                                            <input 
                                                id="toggle-manual" 
                                                type="checkbox" 
                                                checked={manualCostPerGEnabled} 
                                                onChange={e=>updateManualCostPerGEnabled(e.target.checked)}
                                                className="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                                            />
                                            <label htmlFor="toggle-manual" className="text-sm text-gray-700">Use manual cost instead</label>
                                        </div>
                                    </div>
                                </div>
                            </CardContent>
                        </Card>

                        {/* PRICING GUIDE */}
                        <Card>
                            <CardContent className="p-4">
                                <div className="grid grid-cols-2 gap-4">
                                    {computed.map(r => (
                                        <div key={r.key} className="rounded-2xl border p-4 text-center">
                                            <div className="text-sm text-gray-500">{r.label}</div>
                                            <div className="mt-1 text-xs text-gray-500">{r.grams}g × {isFinite(costPerG) ? `₱${costPerG.toFixed(2)}` : "—"} + {peso(r.overhead)}</div>
                                            <div className="mt-1 text-xs text-gray-500">Matcha cost: <span className="font-medium">{peso(r.matchaCost)}</span></div>
                                            <div className="mt-2 text-3xl font-semibold">{peso(r.srpRounded)}</div>
                                            <div className="text-[11px] text-gray-500">Exact {peso(r.srpExact)}</div>
                                            <div className="mt-3 flex justify-center gap-2">
                                                <Button variant="outline" className="gap-1" onClick={()=>copy(`${Math.round(r.srpRounded)}`)}>
                                                    <Copy className="w-4 h-4" /> Copy
                                                </Button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-3 text-xs text-gray-500">SRP = overhead + (grams × cost per gram). Adjust overheads and portions in Base settings. Hide them when you're set.</div>
                            </CardContent>
                        </Card>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MatchaPricingCalculator />);
    </script>
</body>
</html>
