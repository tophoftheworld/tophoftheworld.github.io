<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SM Aura — POS Event Setup</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #log { margin-top: 1rem; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.5; }
    .ok { color: #0a7; }
    .err { color: #c00; }
    .muted { color: #666; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>SM Aura pop-up setup</h1>
  <p class="muted">Archives Souk Trinoma (Matcha + Ube), then creates/updates this pop-up with <code>sm_aura_menu.json</code>.</p>
  <button type="button" id="runBtn">Create / update event</button>
  <div id="log"></div>
  <script type="module">
    import { db, collection, addDoc, getDocs, updateDoc, doc } from './js/firebase-setup.js';

    const EVENT_NAME = 'SM Aura';
    const EVENT_KEY = 'popup-sm-aura-2026';
    const MENU_PATH = './data/sm_aura_menu.json';
    const ARCHIVE_KEY_PREFIXES = ['popup-souk-trinoma-matcha-ube'];
    const logEl = document.getElementById('log');

    function log(msg, cls = '') {
      const line = document.createElement('div');
      line.textContent = msg;
      if (cls) line.className = cls;
      logEl.appendChild(line);
    }

    function shouldArchive(data) {
      const key = String(data.key || '');
      if (key === EVENT_KEY) return false;
      return ARCHIVE_KEY_PREFIXES.some((prefix) => key === prefix || key.startsWith(prefix + '-'));
    }

    async function runSetup() {
      logEl.innerHTML = '';
      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      try {
        log('Loading menu…');
        const res = await fetch(MENU_PATH);
        if (!res.ok) throw new Error(`Could not load menu (${res.status}). Serve this folder over HTTP (e.g. live server), not file://`);
        const menuData = await res.json();

        const snap = await getDocs(collection(db, 'branches'));
        let existing = null;
        snap.forEach((d) => {
          const data = d.data();
          if (data.key === EVENT_KEY) existing = { id: d.id, ...data };
        });

        for (const d of snap.docs) {
          const data = d.data();
          if (shouldArchive(data) && !data.archived) {
            await updateDoc(doc(db, 'branches', d.id), {
              archived: true,
              status: 'archived',
              lastModified: new Date().toISOString()
            });
            log(`Archived: ${data.name || data.key}`, 'ok');
          }
        }

        if (existing) {
          log(`Event already exists (${EVENT_KEY}). Updating menu…`, 'ok');
          await updateDoc(doc(db, 'branches', existing.id), {
            name: EVENT_NAME,
            type: 'popup',
            serviceType: 'popup',
            archived: false,
            status: 'active',
            customMenu: menuData,
            lastModified: new Date().toISOString()
          });
          log('Menu attached.', 'ok');
        } else {
          log('Creating event in Firebase…');
          const eventData = {
            key: EVENT_KEY,
            name: EVENT_NAME,
            type: 'popup',
            serviceType: 'popup',
            archived: false,
            createdAt: new Date().toISOString(),
            createdBy: 'sm-aura-setup',
            status: 'active',
            customMenu: menuData
          };
          const docRef = await addDoc(collection(db, 'branches'), eventData);
          log(`Created event: [Popup] ${EVENT_NAME} (${EVENT_KEY}) id=${docRef.id}`, 'ok');
        }

        log(`\nDone. Open POS and select "[Popup] ${EVENT_NAME}".`, 'ok');
        log(`Categories: ${menuData.categories.length}, items: ${menuData.items.length}`, 'muted');
        return true;
      } catch (e) {
        console.error(e);
        log(`Error: ${e.message}`, 'err');
        return false;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('runBtn').addEventListener('click', runSetup);

    if (new URLSearchParams(location.search).has('autorun')) {
      runSetup();
    }
  </script>
</body>
</html>
