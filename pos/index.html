<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matchanese Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/normalize.css?v=4">
    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="shortcut icon" href="icons/icon-512.png" type="image/png">
    
    <!-- For iOS devices -->
    <link rel="apple-touch-icon" href="icons/icon-512.png">

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body class="body">
<div class="menu-wrapper">
    <div class="header-container">
        <div class="header-left">
            <h1 class="menu-header">MATCHA BAR <span class="light">MENU</span></h1>
            <div class="view-toggle-container">
                <button class="view-toggle-btn" id="viewToggleBtn" title="Toggle between list and grid view">
                    <span class="view-toggle-icon">
                        <!-- Grid icon (4 separated squares) -->
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="grid-icon">
                            <rect x="1" y="1" width="6" height="6" rx="1"/>
                            <rect x="9" y="1" width="6" height="6" rx="1"/>
                            <rect x="1" y="9" width="6" height="6" rx="1"/>
                            <rect x="9" y="9" width="6" height="6" rx="1"/>
                        </svg>
                        <!-- List icon (3 horizontal lines) -->
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="list-icon" style="display: none;">
                            <rect x="2" y="3" width="12" height="2" rx="1"/>
                            <rect x="2" y="7" width="12" height="2" rx="1"/>
                            <rect x="2" y="11" width="12" height="2" rx="1"/>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
        <img src="images/matchanese-logo.png" alt="Matchanese Logo" class="header-logo header-logo-desktop">
        <img src="images/matchanese-icon.png" alt="Matchanese Logo" class="header-logo header-logo-mobile">
    </div>
    <div class="kiosk-container">
            <div id="menu-container" class="content menu">
                <div class="left-menu" id="menuContent">
                    <!-- Menu content will be loaded dynamically here -->
                </div>
            </div>
            <div id="order-panel" class="right-panel">
                <div class="order-header-container">
                    <h2 class="order-header" id="orderHeader">
                        <span class="order-header-text">YOUR <span class="light">ORDER</span></span>
                    </h2>
                    <button class="add-more-btn" id="mobileBackButton">+</button>
                </div>
                <div class="order-items">
                    <!-- Order items will be displayed here -->
                    <div class="empty-order-message">Your order is empty</div>
                </div>
                <div class="order-summary">
                    <div class="order-total">
                        <span>Total:</span>
                        <span class="price">₱ 0.00</span>
                    </div>
                </div>
                <div class="payment-methods popup-payment-methods">
                    <button class="payment-button" id="cash-payment">CASH</button>
                    <button class="payment-button" id="gcash-payment">GCASH</button>
                    <button class="payment-button" id="card-payment">CARD</button>
                </div>
                <div class="payment-methods package-payment-methods" style="display: none;">
                    <button class="payment-button package-submit-btn" id="package-submit">SUBMIT ORDER</button>
                </div>
            </div>
            <div id="orders-container" class="content orders" style="display: none;">
                <div id="ordersContent">
                    <div class="orders-header">
                        <div class="date-picker-container">
                            <div class="event-selector-container">
                                <select class="event-selector" id="eventSelector">
                                    <option value="">Loading...</option>
                                </select>
                            </div>
                            <button class="date-nav-btn" id="prevDay">‹</button>
                            <button class="date-display" id="dateDisplay">TODAY</button>
                            <button class="date-nav-btn" id="nextDay">›
                                <button class="date-nav-btn refresh-btn" id="refreshBtn"><span class="refresh-icon">↻</span></button>
                        </div>
                        <div class="date-actions">
                            <button class="delete-date-btn" id="deleteDay">DELETE THIS DAY'S DATA</button>
                            <button class="z-reading-btn" id="endOfDayBtn">Sales Summary</button>
                            <button class="force-sync-btn" id="forceSyncBtn">Force Sync</button>
                        </div>
                        <div class="total-sales" id="totalSalesBlock">
                            <div class="total-sales-left">
                                <div class="sales-amount" id="salesAmount">₱0.00</div>
                                <div class="sales-label" id="salesLabel">TOTAL SALES</div>
                            </div>
                            <div class="total-sales-right">
                                <div class="sales-sub-label" id="salesSubLabel"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Order cards will be displayed here -->
                </div>
            </div>
        </div>
    </div>
        <div class="mobile-order-button" id="mobileOrderButton">
            <span>VIEW ORDER</span>
            <span class="mobile-order-total">₱ 0.00</span>
        </div>
        <div id="sheet-backdrop" class="sheet-backdrop"></div>

    <script type="module" src="js/firebase-setup.js?v=4"></script>
    <script type="module" src="js/firebase-sync.js?v=4"></script>
    <script type="module" src="js/menu-data.js?v=4"></script>
    <script type="module" src="js/script.js?v=4"></script>
</body>

</html>
